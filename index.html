bjects so they move and scale together. Shift + Ctrl/Cmd + G ungroups.","w":"The wrong options are word-play on the letter G; the shortcut has none of those functions.","c":"Lecture 3 | Pathfinder, Grouping and Arranging | sample question (quiz Q14)"},{"q":"Which shortcut ungroups a selected group of objects?","o":["Shift + Ctrl/Cmd + G","Ctrl/Cmd + G","Shift + Ctrl/Cmd + [","Alt/Option + Ctrl/Cmd + S"],"a":0,"e":"Shift + Ctrl/Cmd + G ungroups, while Ctrl/Cmd + G groups.","w":"Ctrl/Cmd + G does the opposite (groups); Shift + Ctrl/Cmd + [ sends an object to the back; Alt/Option + Ctrl/Cmd + S is Save a Copy.","c":"Lecture 3 | Pathfinder, Grouping and Arranging | basis: explanation of quiz Q14"},{"q":"How do you change the fill color of a selected shape?","o":["Change the Artboard size","Press Delete","Change the document units","Change the Fill color in the Toolbar or the Properties panel"],"a":3,"e":"Use the Fill swatch in the Toolbar or the Properties panel. The Stroke swatch controls the outline color.","w":"Artboard size, Delete and document units do not affect a shape's color.","c":"Lecture 3 | Fill and Stroke | sample question (quiz Q15)"},{"q":"Which swatch controls the outline color of a selected shape?","o":["The Fill swatch","The Opacity setting","The Stroke swatch (Toolbar or Properties panel)","The Document color mode setting"],"a":2,"e":"The Fill swatch sets the interior color and the Stroke swatch sets the outline color; both are found in the Toolbar and the Properties panel.","w":"The Fill swatch colors the inside, not the outline; Opacity controls transparency; the color mode defines RGB/CMYK for the whole document.","c":"Lecture 3 | Fill and Stroke | basis: explanation of quiz Q15"},{"q":"Which tool lets you change the stacking order so one shape appears behind another?","o":["Edit > Undo","Right-click > Arrange > Send Backward / Send to Back","File > Place","View > Outline"],"a":1,"e":"Right-click > Arrange (or Object > Arrange) controls which shape sits in front or behind.","w":"Undo reverses an action, Place imports a file, and Outline is a view mode.","c":"Lecture 3 | Pathfinder, Grouping and Arranging | sample question (quiz Q16)"},{"q":"Which shortcut sends the selected shape to the back of the stacking order?","o":["Shift + Ctrl/Cmd + [","Shift + Ctrl/Cmd + G","Ctrl/Cmd + G","Alt/Option + Ctrl/Cmd + S"],"a":0,"e":"Shift + Ctrl/Cmd + [ sends the object to the back, which is how the lower part of the cat's ears is hidden behind the head.","w":"Shift + Ctrl/Cmd + G ungroups, Ctrl/Cmd + G groups, and Alt/Option + Ctrl/Cmd + S saves a copy.","c":"Lecture 3 | Building Animals from Basic Shapes | basis: explanation of quiz Q19"},{"q":"To draw a cat's head, which basic shapes are the most natural choice?","o":["Only one star","Only lines","A large rectangle only","A circle for the head and two triangles for the ears"],"a":3,"e":"A circle (Ellipse + Shift) for the head and two triangles (Polygon, 3 sides) for the ears is the classic start.","w":"A single star, only lines, or one rectangle cannot build a head with two ears.","c":"Lecture 3 | Building Animals from Basic Shapes | sample question (quiz Q17)"},{"q":"After making the left ear, what is the fastest way to create a symmetrical right ear?","o":["Draw it from scratch freehand","Delete the head","Copy it and use Reflect (Object > Transform > Reflect > Vertical)","Change the document color mode"],"a":2,"e":"Copy the ear, then reflect it vertically (the Reflect Tool is O) and move it into place.","w":"Freehand drawing is slow and rarely symmetrical; deleting the head or changing the color mode produces no mirrored ear.","c":"Lecture 3 | Building Animals from Basic Shapes | sample question (quiz Q18)"},{"q":"Which shortcut activates the Reflect Tool used to mirror a copied ear?","o":["L","O","M","V"],"a":1,"e":"The Reflect Tool is O.","w":"L is the Ellipse Tool, M is the Rectangle Tool, and V is the Selection Tool.","c":"Lecture 3 | Building Animals from Basic Shapes | basis: explanation of quiz Q18"},{"q":"Why is it useful to place ears behind the head circle?","o":["The inner part of the ear gets hidden so the head looks clean","It makes the file smaller","It changes the color mode","It makes the shape editable as text"],"a":0,"e":"Sending the ears to back (Shift + Ctrl/Cmd + [) hides their lower part behind the head.","w":"Stacking order has no effect on file size, color mode, or text editing.","c":"Lecture 3 | Building Animals from Basic Shapes | sample question (quiz Q19)"},{"q":"Which basic shapes would you use for a simple fish?","o":["Two stars","Only text","An ellipse for the body and a triangle for the tail","A single line"],"a":2,"e":"An ellipse body plus a triangle tail, with a small circle for the eye and a smaller ellipse for the fin.","w":"Stars, text, or a single line cannot form a body and tail.","c":"Lecture 3 | Building Animals from Basic Shapes | sample question (quiz Q20)"},{"q":"In the simple fish drawing, which shapes are used for the eye and the fin?","o":["A small triangle for the eye and a small circle for the fin","A small ellipse for the eye and a triangle for the fin","A small star for the eye and a line for the fin","A small circle for the eye and a smaller ellipse for the fin"],"a":3,"e":"The lecture builds the fish from an ellipse body and a triangle tail, then adds a small circle for the eye and a smaller ellipse for the fin.","w":"The other options swap or replace the shapes with ones the lecture does not use (triangle eye, triangle fin, star eye).","c":"Lecture 3 | Building Animals from Basic Shapes | basis: explanation of quiz Q20"},{"q":"Which tool is best for drawing a cat's whiskers or a straight leg?","o":["Ellipse Tool","Line Segment Tool (\\)","Star Tool","Rounded Rectangle Tool"],"a":1,"e":"The Line Segment Tool draws straight lines. Stroke weight is set in the Stroke panel or the Properties panel.","w":"Ellipse, Star and Rounded Rectangle draw closed shapes, not straight lines.","c":"Lecture 3 | Building Animals from Basic Shapes | sample question (quiz Q21)"},{"q":"How can you make a bird's body and head quickly from basic shapes?","o":["Two circles of different sizes and a small triangle for the beak","One big square and no other shapes","Only a line","A star for the whole bird"],"a":0,"e":"A larger circle for the body, a smaller circle for the head, a triangle beak and a small circle for the eye.","w":"A single square, a line, or a star cannot provide a body, a head and a beak.","c":"Lecture 3 | Building Animals from Basic Shapes | sample question (quiz Q22)"},{"q":"What helps keep the parts of an animal together after finishing the drawing?","o":["Delete all strokes","Change the artboard orientation","Select everything and group it (Ctrl/Cmd + G)","Turn on Outline mode"],"a":2,"e":"Grouping keeps all the shapes together so you can move or scale the animal as one object.","w":"Deleting strokes, changing orientation, and Outline mode (a view setting) do not bind objects together.","c":"Lecture 3 | Building Animals from Basic Shapes | sample question (quiz Q23)"},{"q":"Which tool lets you adjust the corners of a rectangle by dragging a small circle widget?","o":["Eraser Tool","Eyedropper Tool","Zoom Tool","Live Corners widget (with the Selection Tool)"],"a":3,"e":"Select a rectangle and drag the corner widget to round its corners, which is useful for cute animal bodies.","w":"The Eraser removes artwork, the Eyedropper samples appearance, and Zoom only changes the view.","c":"Lecture 3 | Building Animals from Basic Shapes | sample question (quiz Q24)"},{"q":"Which format is Illustrator's native format that keeps layers and full editing?","o":[".jpeg",".ai",".png",".txt"],"a":1,"e":".ai (Adobe Illustrator) keeps vectors, layers and everything editable.","w":".jpeg and .png are flattened raster formats, and .txt is plain text.","c":"Lecture 3 | Saving and Exporting | sample question (quiz Q25)"},{"q":"Which menu command saves the file as .ai for the first time?","o":["File > Print","Edit > Copy","View > Save","File > Save (Ctrl/Cmd + S)"],"a":3,"e":"Use File > Save (or Save As) with the Adobe Illustrator (ai) format, then confirm the Illustrator Options dialog.","w":"Print sends the file to a printer, Edit > Copy copies to the clipboard, and the View menu has no Save command.","c":"Lecture 3 | Saving and Exporting | sample question (quiz Q26)"},{"q":"After choosing the Adobe Illustrator (ai) format and saving, which dialog do you confirm next?","o":["Illustrator Options","Save Adobe PDF","JPEG Options","New Document"],"a":0,"e":"When saving as .ai, you confirm the Illustrator Options dialog.","w":"Save Adobe PDF appears when saving as PDF, JPEG Options appears when exporting a JPEG, and New Document is used when starting a file.","c":"Lecture 3 | Saving and Exporting | basis: explanation of quiz Q26"},{"q":"Which command lets you save a different version without changing the current file?","o":["File > Close","Edit > Paste","File > Save a Copy","Object > Expand"],"a":2,"e":"Save a Copy (Alt/Option + Ctrl/Cmd + S) saves another file while you keep working on the original.","w":"Close ends the session, Paste inserts clipboard content, and Expand is an object command, not a save command.","c":"Lecture 3 | Saving and Exporting | sample question (quiz Q27)"},{"q":"Which shortcut runs Save a Copy?","o":["Ctrl/Cmd + S","Alt/Option + Ctrl/Cmd + S","Ctrl/Cmd + N","Shift + Ctrl/Cmd + ["],"a":1,"e":"Save a Copy is Alt/Option + Ctrl/Cmd + S.","w":"Ctrl/Cmd + S is the normal Save, Ctrl/Cmd + N opens a new document, and Shift + Ctrl/Cmd + [ sends an object to the back.","c":"Lecture 3 | Saving and Exporting | basis: explanation of quiz Q27"},{"q":"How do you save the design as a PDF?","o":["File > Save As, choose Adobe PDF (pdf) as the format, then Save PDF","File > Open","Edit > Preferences","Window > PDF"],"a":0,"e":"Choose Adobe PDF in the Save As dialog, then pick a preset (for example High Quality Print) in the Save Adobe PDF dialog.","w":"Open loads a file, Preferences changes application settings, and the Window menu manages panels (it has no PDF command).","c":"Lecture 3 | Saving and Exporting | sample question (quiz Q28)"},{"q":"Which option in the Save Adobe PDF dialog lets you open and edit the PDF later in Illustrator?","o":["Optimize for Fast Web View only","Delete layers","Convert to JPEG","Preserve Illustrator Editing Capabilities"],"a":3,"e":"Preserve Illustrator Editing Capabilities keeps the file editable in Illustrator.","w":"Fast Web View targets viewing speed, not editability; deleting layers or converting to JPEG removes editing capability.","c":"Lecture 3 | Saving and Exporting | sample question (quiz Q29)"},{"q":"In the Save Adobe PDF dialog, what do you pick to control the output quality, for example for printing?","o":["A file extension, such as .jpeg","The Use Artboards option","A preset, such as High Quality Print","A color mode, such as Grayscale"],"a":2,"e":"After choosing Adobe PDF in Save As, you pick a preset in the Save Adobe PDF dialog; High Quality Print is the example given.","w":"A file extension is chosen in Save As, Use Artboards belongs to the Export dialog, and the color mode is set when the document is created.","c":"Lecture 3 | Saving and Exporting | basis: explanation of quiz Q28"},{"q":"How do you save the design as a JPEG?","o":["File > Save As, choose AI","File > Export > Export As, choose JPEG","File > Revert","Object > Rasterize only"],"a":1,"e":"JPEG is exported with File > Export > Export As (or Export for Screens), then JPEG Options.","w":"Save As > AI creates an Illustrator file, Revert returns to the last saved version, and Object > Rasterize only converts objects inside the document without exporting a JPEG file.","c":"Lecture 3 | Saving and Exporting | sample question (quiz Q30)"},{"q":"In the Export dialog, what does 'Use Artboards' do?","o":["Adds extra artboards","Converts the file to PDF","Deletes hidden layers","Exports only the artboard area instead of everything on the canvas"],"a":3,"e":"Use Artboards exports each artboard as its own file.","w":"It does not add artboards, change the file format, or delete layers.","c":"Lecture 3 | Saving and Exporting | sample question (quiz Q31)"},{"q":"In the Export dialog, what determines the exported area when 'Use Artboards' is NOT checked?","o":["The bounds of the artwork","The size of the first artboard only","The entire canvas including empty space","The document's color mode"],"a":0,"e":"Without Use Artboards, the exported area follows the artwork bounds.","w":"The exported area is not limited to the first artboard and is not the whole canvas; it follows the artwork bounds. Color mode has no effect on the exported area.","c":"Lecture 3 | Saving and Exporting | basis: explanation of quiz Q31"},{"q":"Which resolution is typical for JPEG images shown on screens?","o":["1 ppi","5000 ppi","72 ppi","0 ppi"],"a":2,"e":"72 ppi is typical for screen and 300 ppi for print (high quality).","w":"1 and 0 ppi are meaningless resolutions, and 5000 ppi is far beyond typical screen needs.","c":"Lecture 3 | Saving and Exporting | sample question (quiz Q32)"},{"q":"Which resolution does the lecture associate with high-quality JPEG images made for print?","o":["72 ppi","300 ppi","150 ppi","600 ppi"],"a":1,"e":"The lecture pairs 72 ppi with screens and 300 ppi with print (high quality).","w":"72 ppi is the screen value; 150 and 600 ppi are not the values given in the lecture.","c":"Lecture 3 | Saving and Exporting | basis: explanation of quiz Q32"},{"q":"What is a key limit of JPEG compared with AI?","o":["JPEG is raster, loses vectors/layers and does not support transparency","JPEG keeps all layers","JPEG is always editable as vectors","JPEG is larger than any other format"],"a":0,"e":"JPEG flattens the artwork to pixels, so a .ai copy should be kept for future editing.","w":"The first two wrong options claim the opposite of what JPEG does, and the size claim is not a limit described in the lecture.","c":"Lecture 3 | Saving and Exporting | sample question (quiz Q33)"},{"q":"A designer exports a logo as a JPEG and then deletes the original file. Why is this a problem?","o":["JPEG automatically converts the logo to CMYK and locks it","JPEG files cannot be displayed on screens","JPEG keeps the layers but removes all colors","JPEG flattens the artwork to pixels, so the vector paths and layers can no longer be edited"],"a":3,"e":"JPEG is raster: it loses vectors and layers, which is why a .ai copy should be kept for future editing.","w":"JPEG does not lock color modes, it displays fine on screens, and it does not keep layers.","c":"Lecture 3 | Saving and Exporting | basis: explanation of quiz Q33"}],[{"q":"Which style uses solid color fills, a limited palette and overlapping layers of shapes to create depth in Illustrator?","o":["Photo retouching","Flat vector illustration","Pixel art in Photoshop","3D rendering"],"a":1,"e":"Flat vector illustration relies on simple shapes, solid colors and layering, without complex gradients or realistic textures.","w":"Photo retouching and Photoshop pixel art are raster workflows, and 3D rendering relies on realistic volume rather than flat solid fills.","c":"Lecture 4 | Flat Vector Style and Planning | sample question (quiz Q1)"},{"q":"Which of the following is NOT typical of flat vector illustration?","o":["Solid color fills","A limited color palette","Complex gradients and realistic textures","Overlapping layers of shapes to create depth"],"a":2,"e":"Flat vector illustration relies on simple shapes, solid colors and layering, without complex gradients or realistic textures.","w":"Solid fills, a limited palette and overlapping shape layers are exactly the features that define the flat style.","c":"Lecture 4 | Flat Vector Style and Planning | basis: explanation of quiz Q1"},{"q":"What is a good first step before drawing a landscape-style illustration?","o":["Delete all layers","Choose the artboard size and a limited color palette","Export the file","Apply gradients everywhere"],"a":1,"e":"Set the artboard and the palette first, then build the scene from large shapes to small details.","w":"Deleting layers or exporting is not a first step, and applying gradients everywhere contradicts a limited, flat approach.","c":"Lecture 4 | Flat Vector Style and Planning | sample question (quiz Q2)"},{"q":"In which order should the scene elements usually be drawn?","o":["Details first, background last","Foreground only","Background to foreground: sky, far shapes, nearer shapes, then details","Random order"],"a":2,"e":"Draw big background shapes first, then add the nearer layers and fine details on top.","w":"Drawing details first or only the foreground breaks the background-to-foreground build-up, and a random order gives no depth logic.","c":"Lecture 4 | Flat Vector Style and Planning | sample question (quiz Q3)"},{"q":"How can you place a reference image to trace or follow in Illustrator?","o":["File > Place, then lock it on its own layer (optionally set as Template)","Use the Eraser on it","Paste it on the menu bar","Save it as AI"],"a":0,"e":"Place the reference on a separate layer, lower its opacity or use Template, and lock it so you do not move it by accident.","w":"The Eraser would destroy the reference, a menu bar is not a place for images, and saving as AI does not place a reference image.","c":"Lecture 4 | Reference Images and Layers | sample question (quiz Q4)"},{"q":"Why use separate layers for sky, far hills, near hills and details?","o":["Illustrator requires 10 layers","To remove anchor points","To change the file size to zero","To organize depth, lock finished parts and edit one part without moving others"],"a":3,"e":"Layers keep the artwork organized and let you lock or hide groups of objects.","w":"Illustrator has no 10-layer requirement, layers do not remove anchor points, and they cannot reduce a file to zero size.","c":"Lecture 4 | Reference Images and Layers | sample question (quiz Q5)"},{"q":"Which shortcut toggles Outline view so you can see the paths of overlapping shapes?","o":["Ctrl/Cmd + Y","Ctrl/Cmd + P","Ctrl/Cmd + H","Ctrl/Cmd + K"],"a":0,"e":"Ctrl/Cmd + Y switches between Preview and Outline mode.","w":"Only Ctrl/Cmd + Y switches between Preview and Outline mode; the other shortcuts do not toggle the view mode.","c":"Lecture 4 | View and Navigation | sample question (quiz Q6)"},{"q":"Which tool is best for drawing a perfect circle such as a sun or moon?","o":["Eraser Tool","Ellipse Tool with Shift held","Pen Tool without any clicks","Zoom Tool"],"a":1,"e":"Hold Shift while dragging the Ellipse Tool to keep the proportions equal.","w":"The Eraser removes artwork, the Pen Tool without any clicks draws nothing, and Zoom only changes the view.","c":"Lecture 4 | Basic Shapes for Scene Elements | sample question (quiz Q7)"},{"q":"Which tool draws small stars quickly?","o":["Arc Tool","Line Segment Tool","Star Tool","Rectangle Tool"],"a":2,"e":"The Star Tool (under the Rectangle Tool group) draws stars; use Up/Down arrow keys while dragging to change the number of points.","w":"The Arc, Line Segment and Rectangle tools create arcs, straight lines and rectangles, not stars.","c":"Lecture 4 | Basic Shapes for Scene Elements | sample question (quiz Q8)"},{"q":"In the Toolbar, where is the Star Tool found?","o":["In the same tool group as the Pen Tool","In the same tool group as the Zoom Tool","In the same tool group as the Rectangle Tool","In the same tool group as the Eraser Tool"],"a":2,"e":"The Star Tool sits under the Rectangle Tool group.","w":"The Pen, Zoom and Eraser tools belong to different groups and do not contain the Star Tool.","c":"Lecture 4 | Basic Shapes for Scene Elements | basis: explanation of quiz Q8"},{"q":"How can you make a triangle quickly, for example a tree shape?","o":["Spiral Tool","Pencil Tool with Alt","Ellipse Tool with Shift","Polygon Tool with 3 sides"],"a":3,"e":"Press the Down arrow key while dragging the Polygon Tool until it has 3 sides.","w":"Spiral draws spirals, Pencil with Alt is not the method described, and Ellipse with Shift draws a circle.","c":"Lecture 4 | Basic Shapes for Scene Elements | sample question (quiz Q9)"},{"q":"How do you build a simple pine tree from basic shapes?","o":["Use the Eraser Tool","Use only a circle","Draw one star","Stack several triangles of different sizes and add a small rectangle trunk"],"a":3,"e":"Stack 2-4 triangles, then add a rectangle trunk. Unite them for one clean shape.","w":"The Eraser removes artwork, and a single circle or a single star cannot give the stacked-triangles-and-trunk tree shape.","c":"Lecture 4 | Basic Shapes for Scene Elements | sample question (quiz Q10)"},{"q":"According to the lecture, how many triangles are usually stacked to build a simple pine tree?","o":["A single triangle","6 to 8 triangles","2 to 4 triangles of different sizes","More than 10 triangles"],"a":2,"e":"Stack 2-4 triangles, then add a rectangle trunk and unite them for one clean shape.","w":"A single triangle gives no layered tree, and 6 or more triangles is beyond the 2-4 the lecture suggests.","c":"Lecture 4 | Basic Shapes for Scene Elements | basis: explanation of quiz Q10"},{"q":"How can you create a cloud from basic shapes?","o":["Overlap several circles of different sizes and unite them","Draw one long straight line","Use the Zoom Tool","Use the Star Tool"],"a":0,"e":"Overlap circles and merge them with Pathfinder > Unite or Shape Builder, then flatten the bottom if needed.","w":"A single straight line, the Zoom Tool and the Star Tool do not produce a cloud's rounded, overlapping outline.","c":"Lecture 4 | Basic Shapes for Scene Elements | sample question (quiz Q11)"},{"q":"How do you make a rounded rectangle without changing the tool?","o":["Drag a corner widget of the selected rectangle (Live Corners)","Press Delete","Group it","Change the document color mode"],"a":0,"e":"Select the rectangle and drag the small circle widget at a corner to round it.","w":"Delete removes the object, grouping binds objects together, and the color mode does not affect corner shape.","c":"Lecture 4 | Basic Shapes for Scene Elements | sample question (quiz Q12)"},{"q":"How do you create several copies of a tree quickly with a different position?","o":["Export and import","Use Save As","Draw each one from scratch each time only","Alt/Option + drag a copy, then Ctrl/Cmd + D to repeat the movement"],"a":3,"e":"Alt/Option + drag duplicates; Transform Again (Ctrl/Cmd + D) repeats the last move, scale or rotate.","w":"Export/import and Save As do not duplicate objects on the artboard, and redrawing every tree is slow and inconsistent.","c":"Lecture 4 | Duplicating and Transforming Objects | sample question (quiz Q13)"},{"q":"What changes do Scale and Reflect help with when duplicating objects?","o":["Change color mode","Make varied copies: different sizes and mirrored versions","Export JPEG","Close a path"],"a":1,"e":"Scale (S) varies size; Reflect (O) mirrors, so repeated objects do not look identical.","w":"Scale and Reflect concern size and mirroring; they do not change the color mode, export files, or close paths.","c":"Lecture 4 | Duplicating and Transforming Objects | sample question (quiz Q14)"},{"q":"Which shortcuts activate the Scale Tool and the Reflect Tool?","o":["S and O","V and A","P and I","L and M"],"a":0,"e":"Scale is S and Reflect is O; together they vary size and mirror copies so repeated objects do not look identical.","w":"V and A are the Selection and Direct Selection tools, P is the Pen Tool, I is the Eyedropper, L is the Ellipse Tool and M is the Rectangle Tool.","c":"Lecture 4 | Duplicating and Transforming Objects | basis: explanation of quiz Q14"},{"q":"Which tool draws a straight line such as a thin horizon or a streak across the sky?","o":["Gradient Tool","Line Segment Tool (\\)","Blob Brush","Spiral Tool"],"a":1,"e":"The Line Segment Tool draws straight lines; set the stroke weight and cap in the Stroke panel.","w":"The Gradient Tool applies gradients, Blob Brush paints freeform blobs, and Spiral draws spirals; none is the straight-line tool.","c":"Lecture 4 | Lines, Pen Tool and Anchor Points | sample question (quiz Q15)"},{"q":"Where do you set the weight and cap of a line drawn with the Line Segment Tool?","o":["In the Swatches panel","In the Pathfinder panel","In the Layers panel","In the Stroke panel"],"a":3,"e":"The Line Segment Tool draws straight lines; the stroke weight and cap are set in the Stroke panel.","w":"Swatches stores colors, Pathfinder combines shapes, and Layers organizes stacking; none controls stroke weight or cap.","c":"Lecture 4 | Lines, Pen Tool and Anchor Points | basis: explanation of quiz Q15"},{"q":"Which tool is most suitable for drawing custom rolling hills with smooth curves and exact control?","o":["Rectangle Tool","Zoom Tool","Polygon Tool","Pen Tool (P)"],"a":3,"e":"The Pen Tool draws custom paths. Drag when placing points to create smooth curves.","w":"Rectangle and Polygon draw preset geometric shapes and Zoom only changes the view, so none gives custom curves.","c":"Lecture 4 | Lines, Pen Tool and Anchor Points | sample question (quiz Q16)"},{"q":"With the Pen Tool, what do you do while placing a point to create a smooth curve?","o":["Hold Caps Lock","Drag instead of only clicking","Double-click the point","Press the Delete key"],"a":1,"e":"The Pen Tool draws custom paths, and dragging when placing points creates smooth curves.","w":"Caps Lock, double-clicking and Delete are not the action the lecture describes for making a smooth curve point.","c":"Lecture 4 | Lines, Pen Tool and Anchor Points | basis: explanation of quiz Q16"},{"q":"How do you draw a hill shape that stays inside the artboard?","o":["Draw only a closed circle","Use Export only","Draw a line without closing","Draw the wavy top edge, then extend the path past the artboard corners and close it"],"a":3,"e":"Extending the shape beyond the artboard edges avoids gaps at the sides and bottom.","w":"A circle, an export, or an unclosed line cannot make a closed hill that fills the artboard width.","c":"Lecture 4 | Lines, Pen Tool and Anchor Points | sample question (quiz Q17)"},{"q":"What is the advantage of the Curvature Tool (Shift + ~)?","o":["It makes smooth curves by clicking points, without handling handles","It creates 3D objects","It deletes paths","It only draws straight lines"],"a":0,"e":"The Curvature Tool is easier than the Pen for smooth hills and clouds. Double-click to switch a point to a corner.","w":"The Curvature Tool does not create 3D objects, delete paths, or draw only straight lines; it draws smooth curves.","c":"Lecture 4 | Lines, Pen Tool and Anchor Points | sample question (quiz Q18)"},{"q":"With the Curvature Tool, what does double-clicking a point do?","o":["Deletes the point","Closes the path","Turns the path into a gradient","Switches the point to a corner point"],"a":3,"e":"The Curvature Tool makes smooth curves by clicking points; double-click a point to switch it to a corner.","w":"Double-clicking does not delete points, close the path, or apply a gradient.","c":"Lecture 4 | Lines, Pen Tool and Anchor Points | basis: explanation of quiz Q18"},{"q":"With the Pen Tool, what does holding Ctrl/Cmd temporarily switch to?","o":["Zoom Tool","Direct Selection Tool","Gradient Tool","Eraser Tool"],"a":1,"e":"Holding Ctrl/Cmd lets you move anchor points and handles without leaving the Pen Tool.","w":"Holding Ctrl/Cmd with the Pen Tool does not switch to Zoom, Gradient or Eraser.","c":"Lecture 4 | Lines, Pen Tool and Anchor Points | sample question (quiz Q19)"},{"q":"Which tool lets you select and move a single anchor point or handle?","o":["Hand Tool","Artboard Tool","Direct Selection Tool (A)","Selection Tool (V)"],"a":2,"e":"The white arrow edits individual points and handles; the black arrow moves the whole object.","w":"The Hand Tool pans, the Artboard Tool edits artboards, and the Selection Tool (V) moves whole objects.","c":"Lecture 4 | Lines, Pen Tool and Anchor Points | sample question (quiz Q20)"},{"q":"How do you fix a hill curve that looks too sharp?","o":["Drag its direction handles with the Direct Selection Tool or add anchor points","Use the Eraser on the whole page","Delete the whole artboard","Change to RGB"],"a":0,"e":"Adjust handles, or use the Anchor Point Tool to convert corner points into smooth ones.","w":"Erasing, deleting the artboard, or switching to RGB does not reshape a curve.","c":"Lecture 4 | Lines, Pen Tool and Anchor Points | sample question (quiz Q21)"},{"q":"Which tool adds a new anchor point to an existing path?","o":["Eraser Tool","Hand Tool","Zoom Tool","Add Anchor Point Tool (+)"],"a":3,"e":"The Add Anchor Point Tool (+) inserts a point on the path; Delete Anchor Point (-) removes one.","w":"The Eraser, Hand and Zoom tools do not insert points on a path.","c":"Lecture 4 | Lines, Pen Tool and Anchor Points | sample question (quiz Q22)"},{"q":"Which tool removes an anchor point from an existing path?","o":["Add Anchor Point Tool (+)","Delete Anchor Point Tool (-)","Anchor Point Tool (Shift + C)","Scale Tool (S)"],"a":1,"e":"The Add Anchor Point Tool (+) inserts a point on the path, and the Delete Anchor Point Tool (-) removes one.","w":"The Add tool inserts points, the Anchor Point Tool converts points between smooth and corner, and Scale changes size.","c":"Lecture 4 | Lines, Pen Tool and Anchor Points | basis: explanation of quiz Q22"},{"q":"Which tool converts a smooth point to a corner point?","o":["Slice Tool","Rotate Tool","Anchor Point Tool (Shift + C)","Gradient Tool"],"a":2,"e":"The Anchor Point (Convert) Tool toggles between smooth and corner points.","w":"The Slice, Rotate and Gradient tools do not convert point types.","c":"Lecture 4 | Lines, Pen Tool and Anchor Points | sample question (quiz Q23)"},{"q":"Why is it better to use fewer anchor points on a curve?","o":["Illustrator crashes with more points","The curve is smoother and easier to edit","The artboard shrinks","The file turns gray"],"a":1,"e":"Fewer well-placed anchor points create cleaner curves.","w":"Illustrator does not crash with more points, the artboard does not shrink and the file does not turn gray; the real benefit is smoother, easier-to-edit curves.","c":"Lecture 4 | Lines, Pen Tool and Anchor Points | sample question (quiz Q24)"},{"q":"Which Pathfinder command merges overlapping shapes into one?","o":["Intersect","Exclude","Minus Front","Unite"],"a":3,"e":"Unite combines selected shapes into a single outline.","w":"Intersect, Exclude and Minus Front do not merge everything into one outline (Intersect keeps only the shared area and Minus Front cuts the front shape out).","c":"Lecture 4 | Pathfinder and Shape Builder | sample question (quiz Q25)"},{"q":"Which command cuts the front shape out of the back shape?","o":["Unite","Divide","Minus Front","Merge"],"a":2,"e":"Minus Front removes the shapes in front from the shape at the back.","w":"Unite merges shapes, Divide splits them into pieces, and Merge is not the command described for cutting the front shape out.","c":"Lecture 4 | Pathfinder and Shape Builder | sample question (quiz Q26)"},{"q":"Which command keeps only the overlapping area of shapes?","o":["Minus Front","Unite","Intersect","Outline"],"a":2,"e":"Intersect leaves only the shared area. It is useful for shadow shapes inside a larger shape.","w":"Minus Front cuts the front shape out, Unite merges all shapes, and Outline is not the command that keeps the shared area.","c":"Lecture 4 | Pathfinder and Shape Builder | sample question (quiz Q27)"},{"q":"What does the Divide command in Pathfinder do?","o":["Splits overlapping shapes into separate pieces that you can color","Saves the file","Deletes strokes","Merges all shapes into one"],"a":0,"e":"Divide cuts overlapping areas into separate faces; ungroup them to color each piece.","w":"Divide does not save files, delete strokes, or merge everything; it splits overlaps into separate faces.","c":"Lecture 4 | Pathfinder and Shape Builder | sample question (quiz Q28)"},{"q":"After applying Pathfinder > Divide to overlapping shapes, what should you do to color each piece separately?","o":["Ungroup the resulting pieces","Apply Unite to them","Switch the document to RGB","Lock the layer"],"a":0,"e":"Divide cuts overlapping areas into separate faces; ungroup them to color each piece.","w":"Unite would merge the pieces again, the color mode does not separate faces, and locking prevents editing.","c":"Lecture 4 | Pathfinder and Shape Builder | basis: explanation of quiz Q28"},{"q":"Which tool lets you merge or delete regions by dragging directly across shapes?","o":["Hand Tool","Shape Builder Tool (Shift + M)","Zoom Tool","Eraser Tool"],"a":1,"e":"Select the shapes, then drag across regions with the Shape Builder Tool to merge them.","w":"Hand and Zoom only navigate the canvas, and the Eraser is not the tool the lecture uses for merging regions by dragging.","c":"Lecture 4 | Pathfinder and Shape Builder | sample question (quiz Q29)"},{"q":"How do you delete a region using the Shape Builder Tool?","o":["Press Ctrl/Cmd + S","Press Tab","Alt/Option + click the region","Double-click the artboard"],"a":2,"e":"Alt/Option + click removes the region under the cursor.","w":"Ctrl/Cmd + S saves the file, and Tab or double-clicking the artboard do not remove a region.","c":"Lecture 4 | Pathfinder and Shape Builder | sample question (quiz Q30)"},{"q":"Why is Shape Builder often preferred for clouds made from overlapping circles?","o":["It deletes the artboard","It adds gradients automatically","It exports PNG","It merges and trims shapes by dragging, without opening a panel"],"a":3,"e":"It is quick and visual for combining and trimming basic shapes.","w":"Shape Builder does not delete the artboard, add gradients automatically, or export PNG files.","c":"Lecture 4 | Pathfinder and Shape Builder | sample question (quiz Q31)"},{"q":"Where can you open the Pathfinder panel?","o":["File > Pathfinder","Edit > Pathfinder","Window > Pathfinder","View > Pathfinder"],"a":2,"e":"Window > Pathfinder (Shift + Ctrl/Cmd + F9).","w":"The Pathfinder panel is opened from the Window menu; the File, Edit and View menus do not contain it.","c":"Lecture 4 | Pathfinder and Shape Builder | sample question (quiz Q32)"},{"q":"Which shortcut opens the Pathfinder panel?","o":["Ctrl/Cmd + Y","Shift + Ctrl/Cmd + F9","Shift + Ctrl/Cmd + [","Shift + M"],"a":1,"e":"The Pathfinder panel is opened with Window > Pathfinder (Shift + Ctrl/Cmd + F9).","w":"Ctrl/Cmd + Y toggles Outline mode, Shift + Ctrl/Cmd + [ sends an object to the back, and Shift + M is the Shape Builder Tool.","c":"Lecture 4 | Pathfinder and Shape Builder | basis: explanation of quiz Q32"},{"q":"What is the benefit of saving colors as swatches in the Swatches panel?","o":["Reuse the same palette quickly and keep colors consistent","Create 3D","Change the artboard size","Make the file smaller than 1 KB"],"a":0,"e":"Swatches keep the palette organized; global swatches update every object using that color when edited.","w":"Swatches do not create 3D, change the artboard size, or shrink the file.","c":"Lecture 4 | Swatches, Eyedropper and Arranging | sample question (quiz Q33)"},{"q":"What happens when you edit a global swatch?","o":["Only the currently selected object changes","The artboard background changes color","Every object using that color is updated","The file switches to Grayscale"],"a":2,"e":"Swatches keep the palette organized, and global swatches update every object using that color when edited.","w":"A global swatch is not limited to the selected object, and it does not affect the artboard background or the color mode.","c":"Lecture 4 | Swatches, Eyedropper and Arranging | basis: explanation of quiz Q33"},{"q":"Which tool copies the fill color from one object to another?","o":["Eyedropper Tool (I)","Slice Tool","Zoom Tool","Hand Tool"],"a":0,"e":"The Eyedropper samples color from an object; click another object to apply it.","w":"The Slice, Zoom and Hand tools do not sample or apply color.","c":"Lecture 4 | Swatches, Eyedropper and Arranging | sample question (quiz Q34)"},{"q":"How do you move a shape behind another shape?","o":["Object > Arrange > Send Backward / Send to Back","Window > Brushes","File > Place","Edit > Undo"],"a":0,"e":"Arrange controls stacking: Ctrl/Cmd + [ sends backward; Shift + Ctrl/Cmd + [ sends to back.","w":"Brushes opens a panel, Place imports a file, and Undo reverses an action; none changes the stacking order.","c":"Lecture 4 | Swatches, Eyedropper and Arranging | sample question (quiz Q35)"},{"q":"Which shortcut sends the selected object backward by one step in the stacking order?","o":["Shift + Ctrl/Cmd + [","Ctrl/Cmd + Y","Ctrl/Cmd + D","Ctrl/Cmd + ["],"a":3,"e":"Ctrl/Cmd + [ sends backward by one step, while Shift + Ctrl/Cmd + [ sends the object all the way to the back.","w":"Shift + Ctrl/Cmd + [ goes all the way to the back, Ctrl/Cmd + Y toggles Outline mode, and Ctrl/Cmd + D repeats the last transformation.","c":"Lecture 4 | Swatches, Eyedropper and Arranging | basis: explanation of quiz Q35"},{"q":"Before sharing the finished artwork online, which export is typical?","o":["Object > Lock","File > Export > Export As (PNG or JPEG) or Export for Screens","Edit > Preferences","File > Revert"],"a":1,"e":"Export for Screens or Export As creates PNG or JPEG for the web; save the .ai file to keep it editable.","w":"Lock, Preferences and Revert do not produce web-ready files.","c":"Lecture 4 | Exporting and Saving | sample question (quiz Q36)"},{"q":"A designer has exported the finished landscape as a PNG for the web. What should they also do to keep the artwork editable later?","o":["Save the .ai file","Delete the layers before saving","Re-export it as a JPEG as well","Lock every object and close the file"],"a":0,"e":"Export for Screens or Export As creates PNG or JPEG for the web; the .ai file must be saved to keep the artwork editable.","w":"Deleting layers removes structure, a JPEG is another flattened raster export, and locking objects does not preserve an editable file.","c":"Lecture 4 | Exporting and Saving | basis: explanation of quiz Q36"},{"q":"Which key lets you pan around the artboard with the Hand Tool temporarily?","o":["Esc","Spacebar","Delete","Caps Lock"],"a":1,"e":"Hold Spacebar and drag to pan, then release to return to your tool.","w":"Esc, Delete and Caps Lock do not temporarily switch to the Hand Tool.","c":"Lecture 4 | View and Navigation | sample question (quiz Q37)"}],[{"q":"Which three topics does Lecture 5 cover?","o":["Typography, page layout, and export settings","Brushes, layers, and the Pen Tool","Color printing, photo editing, and animation","The color system and its terminology, choosing color schemes, and the color ratio rule"],"a":3,"e":"The lecture covers the color system in Illustrator and its terminology, choosing color schemes, and the color ratio rule.","w":"The other options describe typography, layout, export, brushes, layers, printing, photo or animation topics that are not the lecture's three topics.","c":"Page 2 | Section 1, Introduction | new question"},{"q":"What are the primary colors of the RGB mode?","o":["Red, Yellow, Blue","Black, White, Gray","Cyan, Magenta, Yellow","Red, Green, Blue"],"a":3,"e":"RGB stands for Red, Green and Blue.","w":"Red, Yellow, Blue is the traditional painting set, Black, White, Gray are neutrals, and Cyan, Magenta, Yellow are the CMYK primaries.","c":"Page 2 | Section 2.1, Table 1 | sample question (quiz Q1)"},{"q":"What are the primary colors of the CMYK mode?","o":["Red, Green, Blue and White","Cyan, Magenta, Yellow and K (Key, black)","Red, Orange, Yellow and Green","Black and white only"],"a":1,"e":"CMYK is Cyan, Magenta, Yellow and K (Key, black).","w":"Red, Green, Blue (plus white) belongs to RGB, Red, Orange, Yellow, Green are not primaries of either mode, and black and white alone cannot mix colors.","c":"Page 2 | Section 2.1, Table 1 | sample question (quiz Q2)"},{"q":"RGB is an ____ mixing mode in which colors are made from light.","o":["Passive","Additive","Neutral","Subtractive"],"a":1,"e":"RGB is additive: colors are made from light.","w":"Passive and neutral are not mixing types; subtractive is the mixing type of CMYK inks.","c":"Page 2 | Section 2.1, Table 1 | sample question (quiz Q3)"},{"q":"CMYK is a ____ mixing mode in which colors are made from inks.","o":["Gradient","Digital only","Subtractive","Additive"],"a":2,"e":"CMYK is subtractive: colors are made from inks.","w":"Gradient and Digital only are not mixing types; additive is the mixing type of RGB light.","c":"Page 2 | Section 2.1, Table 1 | sample question (quiz Q4)"},{"q":"Which statement correctly compares the RGB and CMYK color modes?","o":["RGB is subtractive (made from inks) and used for print; CMYK is additive (made from light) and used for screens","RGB is additive (made from light) and used for screens; CMYK is subtractive (made from inks) and used for printed work","RGB is additive (made from light) and used for print; CMYK is subtractive (made from inks) and used for screens","RGB is subtractive (made from inks) and used for screens; CMYK is additive (made from light) and used for print"],"a":1,"e":"Table 1: RGB is additive and made from light, suited to screens, websites and apps; CMYK is subtractive and made from inks, suited to printed work.","w":"Each wrong option swaps the type of mixing, the final medium, or both.","c":"Page 2 | Section 2.1, Table 1 | new question"},{"q":"In RGB, what do all three colors give when they overlap?","o":["White","Black","Gray","Brown"],"a":0,"e":"RGB overlaps: red + green = yellow, red + blue = magenta, green + blue = cyan, all three = white.","w":"Black is what all three CMYK colors give; gray and brown are not results listed in the lecture.","c":"Page 2 | Section 2.1, Table 1 (overlaps row) and Figure 1 | sample question (quiz Q5)"},{"q":"In CMYK, what do cyan + magenta give?","o":["Green","Red","Blue","Yellow"],"a":2,"e":"CMYK overlaps: cyan + yellow = green, cyan + magenta = blue, magenta + yellow = red, all three = black.","w":"Cyan + yellow gives green and magenta + yellow gives red; yellow is a CMYK primary, not the result of cyan + magenta.","c":"Page 2 | Section 2.1, Table 1 (overlaps row) and Figure 1 | sample question (quiz Q6)"},{"q":"In CMYK, what do all three colors give when they overlap?","o":["White","Gray","Brown","Black"],"a":3,"e":"In CMYK, cyan + yellow = green, cyan + magenta = blue, magenta + yellow = red, and all three = black.","w":"White is the result of overlapping all three RGB colors, and gray and brown are not results given in the lecture.","c":"Page 2 | Section 2.1, Table 1 (overlaps row) | new question"},{"q":"What does red + green give in RGB?","o":["White","Magenta","Cyan","Yellow"],"a":3,"e":"Red + green = yellow in the additive RGB mode.","w":"White needs all three RGB colors, magenta is red + blue, and cyan is green + blue.","c":"Page 2 | Section 2.1, Table 1 (overlaps row) and Figure 1 | sample question (quiz Q7)"},{"q":"Which pair of overlap results is correct?","o":["RGB: green + blue = yellow; CMYK: cyan + yellow = blue","RGB: green + blue = cyan; CMYK: cyan + yellow = green","RGB: red + blue = cyan; CMYK: magenta + yellow = blue","RGB: red + green = magenta; CMYK: cyan + magenta = red"],"a":1,"e":"Table 1: in RGB, green + blue = cyan; in CMYK, cyan + yellow = green.","w":"In RGB, red + blue gives magenta and red + green gives yellow; in CMYK, magenta + yellow gives red and cyan + magenta gives blue. Each wrong option mixes up at least one of these results.","c":"Page 2 | Section 2.1, Table 1 (overlaps row) | new question"},{"q":"Which mode is used for websites, apps and digital work?","o":["Pantone only","CMYK","Bitmap","RGB"],"a":3,"e":"RGB is for screens; CMYK is for printed work.","w":"CMYK is the print mode, and Pantone only and Bitmap are not the modes the lecture assigns to screen work.","c":"Page 2 | Section 2.1, Table 1 (typical use row) | sample question (quiz Q8)"},{"q":"Which mode is used for printed work?","o":["RGB","HSB only","CMYK","Web Safe RGB"],"a":2,"e":"CMYK matches printing inks.","w":"RGB is the screen mode; HSB only and Web Safe RGB are not the print mode named in the lecture.","c":"Page 2 | Section 2.1, Table 1 (typical use row) | sample question (quiz Q9)"},{"q":"What does Grayscale contain?","o":["Only blue tones","All hues at full strength","Only shades from black to white, with no hue","Only red tones"],"a":2,"e":"Grayscale has no hue, only differences in lightness.","w":"Grayscale has no hue, so blue-only tones, red-only tones, or full-strength hues do not describe it.","c":"Page 2 | Section 2.2 (Figure 2 on Page 3) | sample question (quiz Q10)"},{"q":"In the hue, saturation and value model, what is Hue?","o":["The size of the object","The color itself: its position on the color wheel","The intensity of the color","The lightness of the color"],"a":1,"e":"Hue is the color itself, such as yellow, red, purple, blue or green.","w":"The size of the object is unrelated, intensity is saturation, and lightness is value.","c":"Page 3 | Section 2.3, Table 2 and Figure 3 | sample question (quiz Q11)"},{"q":"What does Saturation describe?","o":["The position on the color wheel","The size of the artboard","The purity or intensity of the color, from vivid to dull gray","The stroke weight"],"a":2,"e":"Saturation goes from a vivid color down to a dull gray.","w":"Position on the wheel is hue, while artboard size and stroke weight are unrelated to color properties.","c":"Page 3 | Section 2.3, Table 2 and Figure 3 | sample question (quiz Q12)"},{"q":"A designer turns a vivid red into a dull, grayish red. Which property of the color has been reduced?","o":["Saturation","Hue","Value","Fill type"],"a":0,"e":"Saturation is the purity or intensity of the color, from a vivid color down to a dull gray (Figure 3).","w":"A change of hue would mean the color itself changed (for example red to blue), a change of value would mean it became lighter or darker, and fill type (solid, gradient, pattern) is not a color property.","c":"Page 3 | Section 2.3, Table 2 and Figure 3 | new question"},{"q":"What does Value describe?","o":["The lightness or darkness of the color, from white to black","The name of the color","The purity of the color","The number of colors"],"a":0,"e":"Value is how light or dark the color is.","w":"The name of the color is hue, purity is saturation, and the number of colors is not a color property.","c":"Page 3 | Section 2.3, Table 2 and Figure 3 | sample question (quiz Q13)"},{"q":"A tint is made by adding...","o":["Red to a hue","Black to a hue","Gray to a hue","White to a hue"],"a":3,"e":"Tint = hue + white: a lighter, softer version.","w":"Black gives a shade, gray gives a tone, and adding red changes the hue rather than lightening it.","c":"Page 4 | Section 2.4, Table 3 and Figure 4 | sample question (quiz Q14)"},{"q":"A tone is made by adding...","o":["White to a hue","Black to a hue","Blue to a hue","Gray to a hue"],"a":3,"e":"Tone = hue + gray: a more muted, less intense version.","w":"White gives a tint, black gives a shade, and adding blue changes the hue instead of muting it.","c":"Page 4 | Section 2.4, Table 3 and Figure 4 | sample question (quiz Q15)"},{"q":"A shade is made by adding...","o":["White to a hue","Black to a hue","Gray to a hue","Yellow to a hue"],"a":1,"e":"Shade = hue + black: a darker version.","w":"White gives a tint, gray gives a tone, and adding yellow changes the hue.","c":"Page 4 | Section 2.4, Table 3 and Figure 4 | sample question (quiz Q16)"},{"q":"A pure color at full strength is called a...","o":["Hue","Tone","Shade","Tint"],"a":0,"e":"The pure hue is the full-strength color.","w":"A tone is hue + gray, a shade is hue + black, and a tint is hue + white; only the pure color at full strength is the hue.","c":"Page 4 | Section 2.4, Table 3 and Figure 4 | sample question (quiz Q17)"},{"q":"Starting from a pure red, a designer makes three versions: one lighter and softer, one more muted and less intense, and one darker. Which terms describe them, in that order?","o":["Tint, tone, shade","Shade, tint, tone","Tone, shade, tint","Tint, shade, tone"],"a":0,"e":"Tint = hue + white (lighter, softer); tone = hue + gray (more muted, less intense); shade = hue + black (darker).","w":"The order must follow the descriptions; the other options swap two or more of the terms.","c":"Page 4 | Section 2.4, Table 3 and Figure 4 | new question"},{"q":"Which are the three ways to fill an object?","o":["Hue, tint and shade","RGB, CMYK and gray","Only solid color","Solid color, gradient and pattern"],"a":3,"e":"An object can have a solid color, a gradient or a pattern.","w":"Hue, tint and shade are color variations, RGB, CMYK and gray are modes, and solid color is only one of the three fills.","c":"Page 4 | Section 2.5, Table 4 | sample question (quiz Q18)"},{"q":"What is a gradient fill?","o":["A gradual transition from one color to another (two or more colors)","A repeating motif","One uniform color","An outline only"],"a":0,"e":"A gradient blends two or more colors gradually.","w":"A repeating motif is a pattern, one uniform color is a solid fill, and an outline is not a fill type.","c":"Page 4 | Section 2.5, Table 4 | sample question (quiz Q19)"},{"q":"What is a pattern fill?","o":["A shadow","A repeating motif that fills the shape","One uniform color","A transition between colors"],"a":1,"e":"A pattern repeats a motif inside the shape.","w":"A shadow is not a fill type, one uniform color is a solid fill, and a transition between colors is a gradient.","c":"Page 4 | Section 2.5, Table 4 | sample question (quiz Q20)"},{"q":"What does the color wheel show?","o":["The artboard size","The relationships between hues, arranged in a circle","The file size","The font list"],"a":1,"e":"It arranges hues in a circle so relationships can be seen.","w":"Artboard size, file size and the font list have nothing to do with relationships between hues.","c":"Page 5 | Section 3.1, Figure 6 | sample question (quiz Q21)"},{"q":"In the lecture's color wheel, where are the pure hues?","o":["Nowhere","Only at the top","On the outer ring","In the exact center"],"a":2,"e":"The outer ring holds the pure hues; they get lighter toward the center and darker toward the edge.","w":"The lecture places the pure hues on the outer ring; the center is where colors become lighter.","c":"Page 5 | Section 3.1, Figure 6 | sample question (quiz Q22)"},{"q":"In the lecture's color wheel, what happens to a hue as you move from the edge of the wheel toward its center?","o":["It becomes darker, because black is added","It becomes more saturated, because pure color is added","It becomes lighter, because white is added","It changes into its complementary color"],"a":2,"e":"Each hue becomes lighter toward the center (adding white) and darker toward the edge (adding black).","w":"Darkening (adding black) happens toward the edge, not the center; the center is the lighter end rather than a more saturated one; and the wheel does not turn hues into their complements.","c":"Page 5 | Section 3.1, Figure 6 | new question"},{"q":"Which scheme uses three colors next to each other on the wheel?","o":["Split complementary","Complementary","Triadic","Analogous"],"a":3,"e":"Analogous colors sit next to each other.","w":"Split complementary uses one color plus the two beside its opposite, complementary uses two colors, and triadic uses three evenly spaced colors.","c":"Page 5 | Section 3.2, Table 5 (Figure 7 on Page 6) | sample question (quiz Q23)"},{"q":"Which scheme uses two colors directly opposite each other?","o":["Complementary","Analogous","Tetradic","Triadic"],"a":0,"e":"Complementary colors are directly opposite on the wheel.","w":"Analogous colors are neighbors, tetradic uses four colors, and triadic uses three evenly spaced colors.","c":"Page 5 | Section 3.2, Table 5 (Figure 7 on Page 6) | sample question (quiz Q24)"},{"q":"Which scheme uses one color plus the two colors on either side of its opposite?","o":["Tetradic (square)","Complementary","Split complementary","Analogous"],"a":2,"e":"Split complementary: one color plus the two neighbors of its opposite.","w":"Tetradic (square) uses four evenly spaced colors, complementary uses two colors, and analogous uses three neighbors.","c":"Page 5 | Section 3.2, Table 5 (Figure 7 on Page 6) | sample question (quiz Q25)"},{"q":"Which scheme uses three colors spaced evenly like an equilateral triangle?","o":["Triadic","Tetradic","Analogous","Complementary"],"a":0,"e":"Triadic colors are evenly spaced around the wheel.","w":"Tetradic uses four colors, analogous uses neighbors, and complementary uses only two colors.","c":"Page 5 | Section 3.2, Table 5 (Figure 7 on Page 6) | sample question (quiz Q26)"},{"q":"Which scheme forms a rectangle of two complementary pairs?","o":["Analogous","Tetradic (rectangle)","Tetradic (square)","Triadic"],"a":1,"e":"Tetradic (rectangle): four colors forming two pairs of complementary colors.","w":"Analogous uses neighbors, the square tetradic is evenly spaced rather than two complementary pairs, and triadic uses three colors.","c":"Page 5 | Section 3.2, Table 5 (Figure 7 on Page 6) | sample question (quiz Q27)"},{"q":"Which scheme uses four colors spaced evenly around the wheel?","o":["Complementary","Tetradic (square)","Analogous","Tetradic (rectangle)"],"a":1,"e":"Tetradic (square) uses four evenly spaced colors.","w":"Complementary has two colors, analogous has three neighbors, and the rectangle version is not evenly spaced.","c":"Page 5 | Section 3.2, Table 5 (Figure 7 on Page 6) | sample question (quiz Q28)"},{"q":"Which list gives the number of colors in the analogous, complementary, triadic and tetradic schemes, in that order?","o":["3, 2, 3, 4","2, 3, 4, 3","3, 3, 2, 4","4, 2, 3, 3"],"a":0,"e":"Table 5: analogous uses three colors, complementary two, triadic three, and tetradic four.","w":"The other lists swap these counts.","c":"Page 5 | Section 3.2, Table 5 | new question"},{"q":"On the color wheel, what shapes do the colors of a triadic scheme and a tetradic (square) scheme form, respectively?","o":["A square and an equilateral triangle","An equilateral triangle and a square","A straight line and a rectangle","A rectangle and an equilateral triangle"],"a":1,"e":"Triadic colors are spaced evenly like an equilateral triangle, and tetradic (square) colors are spaced evenly like a square.","w":"The other options swap or misname the shapes; the rectangle belongs to the tetradic (rectangle) scheme, and a straight line is the complementary pair.","c":"Page 5 | Section 3.2, Table 5 | new question"},{"q":"In the lecture's Figure 7, which three color schemes are shown in the top row?","o":["Triadic, square and rectangle","Analogous, triadic and square","Complementary, split complementary and rectangle","Analogous, complementary and split complementary"],"a":3,"e":"Figure 7 shows analogous, complementary and split complementary (top) and triadic, square and rectangle (bottom).","w":"The first option is the bottom row, and the other two mix schemes from the two rows.","c":"Page 6 | Figure 7 caption (Section 3.2) | new question"},{"q":"Which colors are warm?","o":["Only black and white","Yellows, oranges and reds","Blues, greens and purples","Only grays"],"a":1,"e":"Warm: yellows, oranges, reds. Cool: blues, greens, purples.","w":"Blues, greens and purples are cool, and black, white and grays are neutrals, not the warm group.","c":"Page 6 | Section 3.3, Figures 8 and 9 | sample question (quiz Q29)"},{"q":"Which seasonal palette is warm and light?","o":["Spring","Summer","Winter","Autumn"],"a":0,"e":"Spring is warm and light; Summer is cool and light.","w":"Summer is cool and light, Winter is cool and deep, and Autumn is warm and deep.","c":"Page 6 | Section 3.3, Figures 8 and 9 | sample question (quiz Q30)"},{"q":"Which seasonal palette is cool and deep?","o":["Spring","Winter","Autumn","Summer"],"a":1,"e":"Winter is cool and deep; Autumn is warm and deep.","w":"Spring is warm and light, Autumn is warm and deep, and Summer is cool and light.","c":"Page 6 | Section 3.3, Figures 8 and 9 | sample question (quiz Q31)"},{"q":"Which pairing of a seasonal palette with its character is correct?","o":["Summer: warm and light","Spring: cool and light","Autumn: warm and deep","Winter: warm and deep"],"a":2,"e":"Spring is warm and light, Summer is cool and light, Autumn is warm and deep, and Winter is cool and deep.","w":"Summer is cool (not warm), Spring is warm (not cool), and Winter is cool (not warm).","c":"Page 6 | Section 3.3, Figure 9 | new question"},{"q":"The four seasonal palettes are built by combining which two pairs of qualities?","o":["Warm or cool, and light or deep","Additive or subtractive, and screen or print","Saturated or dull, and solid or gradient","Primary or secondary, and tint or shade"],"a":0,"e":"The palettes are Spring (warm, light), Summer (cool, light), Autumn (warm, deep) and Winter (cool, deep).","w":"Additive/subtractive and screen/print describe RGB and CMYK; saturation with fill type, and primary/secondary with tint/shade, are not the qualities that define the seasons.","c":"Page 6 | Section 3.3 | new question"},{"q":"In the 60-30-10 rule, what share does the primary color take?","o":["10%","100%","30%","60%"],"a":3,"e":"Primary 60% (dominant, often the background), secondary 30%, accent 10%.","w":"10% is the accent share, 30% is the secondary share, and 100% would leave no room for the other roles.","c":"Page 7 | Section 4, Table 6 and Figure 10 | sample question (quiz Q32)"},{"q":"Which role in the 60-30-10 rule is described as the dominant color covering the largest areas, such as the background?","o":["Secondary","Accent","Primary","Neutral"],"a":2,"e":"Table 6: the primary color (60%) is the dominant color covering the largest areas such as the background.","w":"The secondary is the supporting 30% color, the accent is the small strong 10% color, and 'neutral' is not one of the three roles.","c":"Page 7 | Section 4, Table 6 | new question"},{"q":"What is the role of the accent color in the 60-30-10 rule?","o":["A color used only for text shadows","A supporting color for structure","A small, strong color that draws attention to key elements","The dominant color covering the background"],"a":2,"e":"The 10% accent highlights key elements such as buttons.","w":"A color used only for text shadows is not a role, the supporting color is the secondary, and the dominant background color is the primary.","c":"Page 7 | Section 4, Table 6 and Figure 10 | sample question (quiz Q33)"},{"q":"What is the role of the secondary color (30%)?","o":["A supporting color that adds variety and structure","The strongest accent","The background color","A color that is never used"],"a":0,"e":"The secondary color supports the primary and adds variety.","w":"The strongest accent is the 10% color, the background color is the primary, and the secondary color is used, not ignored.","c":"Page 7 | Section 4, Table 6 and Figure 10 | sample question (quiz Q34)"},{"q":"Which option matches each role of the 60-30-10 rule with its share correctly?","o":["Primary 30%, secondary 60%, accent 10%","Primary 60%, secondary 10%, accent 30%","Primary 60%, secondary 30%, accent 10%","Primary 10%, secondary 30%, accent 60%"],"a":2,"e":"Table 6 and Figure 10: primary 60%, secondary 30%, accent 10%.","w":"Each wrong option swaps the shares between roles.","c":"Page 7 | Section 4, Table 6 and Figure 10 | new question"},{"q":"Can several shades of the same color be used inside one share of the 60-30-10 rule?","o":["Only in CMYK","No, each share must be one flat color","Only in the accent share","Yes, for example three grays inside the 60% share"],"a":3,"e":"Each share can use different shades; the lecture example used three grays for 60% and two pinks for 30%.","w":"Each share does not have to be one flat color, the idea is not limited to CMYK, and it applies to the primary and secondary shares, not only the accent.","c":"Page 7 | Section 4.1, Figure 11 | sample question (quiz Q35)"},{"q":"In the lecture's example of using different shades, which colors fill the 60%, 30% and 10% shares?","o":["Three grays, two pinks and one yellow","Two pinks, three grays and one yellow","Three grays, one yellow and two pinks","One yellow, two pinks and three grays"],"a":0,"e":"In the example, the 60% share uses three grays, the 30% share uses two pinks, and the 10% accent stays as one yellow.","w":"The other options put the colors in the wrong shares.","c":"Page 7 | Section 4.1, Figure 11 | new question"}]];
const T=["Introduction to the Drawing Studio","Elements of Design and Basic Geometric Shapes","Adobe Illustrator Step by Step","Drawing a Vector Design in Illustrator","The Color System in Adobe Illustrator"];
const app=document.getElementById("app");
let L=0,order=[],pos=0,score=0,wrong=[],shuffle=false;
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function getBest(n){try{return JSON.parse(localStorage.getItem("ds-best-"+n))}catch(e){return null}}
function setBest(n,s,t){try{const b=getBest(n);if(!b||s>b.s)localStorage.setItem("ds-best-"+n,JSON.stringify({s,t}))}catch(e){}}
function clear(){app.replaceChildren();window.scrollTo(0,0)}
function home(){
  clear();
  app.append(el("h1",null,"بنك أسئلة Drawing Studio"),el("p","sub","اختار محاضرة وابدأ. كل محاضرة ٥٠ سؤال، والتصحيح بيظهر فورًا بعد كل إجابة."));
  const o=el("div","opts"),lb=el("label"),cb=document.createElement("input");
  cb.type="checkbox";cb.id="shuf";cb.checked=shuffle;cb.onchange=()=>{shuffle=cb.checked};
  lb.append(cb,el("span",null,"ترتيب الأسئلة عشوائي"));o.append(lb);app.append(o);
  const list=el("div","list");
  T.forEach((t,i)=>{
    const b=el("button","lec"),bs=getBest(i+1);
    b.append(el("div","n",String(i+1)));
    const tx=el("div","t");tx.append(el("b",null,t),el("span",null,"المحاضرة "+(i+1)+" · "+D[i].length+" سؤال"));
    b.append(tx,el("div","best"+(bs?" has":""),bs?bs.s+"/"+bs.t:"—"));
    b.onclick=()=>start(i);list.append(b)});
  app.append(list);
}
function start(i,only){
  L=i;pos=0;score=0;wrong=[];
  order=only?only.slice():D[i].map((_,k)=>k);
  if(shuffle)for(let k=order.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[order[k],order[j]]=[order[j],order[k]]}
  quiz();
}
function quiz(){
  clear();
  const n=order.length,q=D[L][order[pos]];
  const top=el("div","top"),bk=el("button","back","← الرئيسية");bk.onclick=home;
  top.append(bk,el("span","en num","Lecture "+(L+1)));
  const bar=el("div","bar"),fill=document.createElement("i");fill.style.width=(pos/n*100)+"%";bar.append(fill);
  const meta=el("div","meta"),mn=el("span",null,"سؤال "+(pos+1)+" من "+n),ms=el("span",null,"الدرجة: "+score);
  meta.append(mn,ms);
  const card=el("div","card");card.append(el("p","q en",q.q));
  const fb=el("div","fb");
  q.o.forEach((t,k)=>{
    const b=el("button","opt"),l=el("b",null,"ABCD"[k]+")");b.append(l,el("span",null,t));
    b.onclick=()=>{
      const ok=k===q.a;
      card.querySelectorAll(".opt").forEach((x,j)=>{x.disabled=true;if(j===q.a)x.classList.add("ok");else if(j===k)x.classList.add("no")});
      if(ok)score++;else wrong.push({id:order[pos],pick:k});
      ms.textContent="الدرجة: "+score;
      const ex=el("div","ex "+(ok?"ok":"no"));
      ex.append(el("strong",null,ok?"إجابة صحيحة ✓":"إجابة خاطئة ✗"));if(!ok){const c=el("div","en num","Correct: "+"ABCD"[q.a]);c.style.marginBottom="4px";ex.append(c)}ex.append(el("p",null,q.e));
      fb.append(ex);
      if(q.w){const d=el("details"),s=el("summary",null,"ليه باقي الاختيارات غلط؟");d.append(s,el("p",null,q.w));fb.append(d)}
      if(q.c)fb.append(el("div","cite","Source: "+q.c));
      const nx=el("button","btn",pos<n-1?"السؤال التالي":"شوف النتيجة");
      nx.onclick=()=>{pos++;pos<n?quiz():result()};fb.append(nx);nx.focus({preventScroll:true});
      nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };
    card.append(b)});
  card.append(fb);
  app.append(top,bar,meta,card);
}
function result(){
  clear();const n=order.length;setBest(L+1,score,n);
  const p=Math.round(score/n*100),card=el("div","card");
  app.append(el("h1",null,"خلصت الاختبار"),el("p","sub en","Lecture "+(L+1)+" · "+T[L]));
  card.append(el("div","score",score+" / "+n),el("p","pct num",p+"%"));
  if(wrong.length){
    card.append(el("b",null,"أسئلة محتاجة مراجعة ("+wrong.length+")"));
    const ul=el("ul","rev");
    wrong.forEach(w=>{const q=D[L][w.id],li=el("li");
      li.append(el("b",null,(w.id+1)+". "+q.q),el("div","y","Your answer: "+"ABCD"[w.pick]+") "+q.o[w.pick]),el("div","r","Correct: "+"ABCD"[q.a]+") "+q.o[q.a]));ul.append(li)});
    card.append(ul);
  }else card.append(el("p",null,"كل الإجابات صح، ممتاز!"));
  const r=el("div","row");
  if(wrong.length){const b=el("button","btn","راجع الغلط بس");b.onclick=()=>start(L,wrong.map(w=>w.id));r.append(b)}
  const a=el("button","btn alt","ابدأ من الأول");a.onclick=()=>start(L);
  const h=el("button","btn alt","الرئيسية");h.onclick=home;
  r.append(a,h);card.append(r);app.append(card);
}
home();
</script>
