<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Drawing Exams"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"></head><body>
<title>Drawing Studio Exams</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#14182b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#f1f3f7; --surface:#ffffff; --ink:#14182b; --muted:#5d6580; --line:#d8dce8;
  --accent:#d9480f; --accent-ink:#ffffff; --accent-soft:#fdeadf;
  --ok:#1c7c47; --ok-bg:#e3f4ea; --no:#b3261e; --no-bg:#fbe8e6;
  --ui:"Cairo","Segoe UI",Tahoma,sans-serif; --en:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1220; --surface:#181c30; --ink:#e9ecf6; --muted:#98a0ba; --line:#2b3250;
  --accent:#ff8a4c; --accent-ink:#1a0e05; --accent-soft:#34211a;
  --ok:#62d391; --ok-bg:#12301f; --no:#ff8f86; --no-bg:#3a1b19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1220; --surface:#181c30; --ink:#e9ecf6; --muted:#98a0ba; --line:#2b3250;
  --accent:#ff8a4c; --accent-ink:#1a0e05; --accent-soft:#34211a;
  --ok:#62d391; --ok-bg:#12301f; --no:#ff8f86; --no-bg:#3a1b19; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.65;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:680px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1{font-size:1.5rem;line-height:1.3;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 20px;font-size:.95rem}
.en{direction:ltr;text-align:left;font-family:var(--en)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

.opts{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.opts label{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.opts input{width:20px;height:20px;accent-color:var(--accent)}
.list{display:flex;flex-direction:column;gap:10px}
.lec{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.lec:hover{border-color:var(--accent)}
.lec .n{font-family:var(--num);font-weight:600;font-size:1.6rem;line-height:1;color:var(--accent);min-width:1.4ch;text-align:center}
.lec .t{min-width:0}
.lec .t b{display:block;font-family:var(--en);font-weight:600;font-size:1rem;line-height:1.35;direction:ltr;text-align:left}
.lec .t span{color:var(--muted);font-size:.85rem}
.lec .best{font-family:var(--num);font-size:.85rem;color:var(--muted);text-align:center;white-space:nowrap}
.lec .best.has{color:var(--ok);font-weight:600}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.back{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;color:var(--muted)}
.back:hover{border-color:var(--accent);color:var(--ink)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.q{font-size:1.08rem;font-weight:600;line-height:1.5;margin:0 0 16px}
.opt{display:flex;gap:12px;width:100%;direction:ltr;text-align:left;font-family:var(--en);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 10px;line-height:1.5}
.opt b{font-family:var(--num);min-width:1.3em;color:var(--muted)}
.opt span{min-width:0;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.no{background:var(--no-bg);border-color:var(--no)}
.fb{margin-top:6px}
.ex{margin-top:6px;padding:12px 14px;border-radius:10px;font-size:.95rem}
.ex.ok{background:var(--ok-bg)}.ex.no{background:var(--no-bg)}
.ex strong{display:block;margin-bottom:2px;font-family:var(--ui)}
.ex p{margin:0;direction:ltr;text-align:left;font-family:var(--en);line-height:1.55}
details{margin-top:10px;font-size:.9rem;color:var(--muted)}
summary{cursor:pointer;font-weight:600;color:var(--ink)}
details p{margin:6px 0 0;direction:ltr;text-align:left;font-family:var(--en)}
.cite{margin-top:8px;font-size:.8rem;color:var(--muted);direction:ltr;text-align:left;font-family:var(--en)}
.btn{margin-top:16px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 24px;font-weight:700}
.btn.alt{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.alt:hover{border-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row .btn{flex:1 1 150px}

.score{text-align:center;font-family:var(--num);font-weight:600;font-size:3rem;line-height:1.2;margin:6px 0 0}
.pct{text-align:center;color:var(--muted);margin:0 0 10px}
.rev{list-style:none;margin:10px 0 0;padding:0}
.rev li{padding:12px 0;border-top:1px solid var(--line);direction:ltr;text-align:left;font-family:var(--en);font-size:.9rem}
.rev li b{display:block;margin-bottom:4px}
.rev .y{color:var(--no)}.rev .r{color:var(--ok)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
<main id="app"></main>
<script>
const D=[[{"q":"Which of the following is NOT among the general objectives of the course stated in the lecture?","o":["Developing composition skills, the construction of elements and characters, and the presentation of works in an integrated way","Developing the ability to experiment and innovate, and to build a personal artistic style","Acquiring the skills of using 3D modeling and animation software to produce animated films","Acquiring the skills of using Adobe Illustrator and Adobe Photoshop for digital drawing"],"a":2,"e":"The lecture lists six objectives: digital drawing skills, Illustrator and Photoshop skills, using lines, shapes, colors, light and shadow and textures, composition skills, experimentation and personal style, and integrated artworks. 3D modeling and animation are never mentioned.","w":"A, B and D each restate a genuine objective (objectives 4, 5 and 2).","c":"Page 1, §2 (What Do You Expect to Learn in This Course?)"},{"q":"According to the course objectives, students should develop the ability to use which group of elements in an artwork?","o":["Lines, shapes, colors, perspective, and typography","Lines, shapes, colors, light and shadow, and textures","Points, lines, volumes, rhythm, and balance","Shapes, colors, layers, filters, and textures"],"a":1,"e":"Objective 3 reads: use lines, shapes, colors, light and shadow, and textures in an artwork.","w":"A replaces light and shadow and textures with perspective and typography. C lists design elements and principles (points, volumes, rhythm, balance) that this objective does not name. D mixes in software features (layers, filters) instead of design elements.","c":"Page 1, §2 (objective 3)"},{"q":"Which statement matches the final general objective of the course?","o":["Producing animated sequences that combine drawing and motion","Building a portfolio of hand-drawn works using traditional tools only","Producing standalone vector logos for commercial clients","Producing integrated digital artworks using the skills acquired in both Adobe Illustrator and Adobe Photoshop"],"a":3,"e":"Objective 6: produce integrated digital artworks using the skills acquired in both Adobe Illustrator and Adobe Photoshop.","w":"A (animation), B (traditional tools only) and C (standalone vector logos) all contradict the digital, integrated, two-program focus.","c":"Page 1, §2 (objective 6)"},{"q":"The course is organized around one formula. Which formula does the lecture state?","o":["Drawing Studio = Idea + Experiment + Technique + Production","Drawing Studio = Sketch + Color + Texture + Production","Drawing Studio = Idea + Tool + Style + Production","Drawing Studio = Idea + Experiment + Technique + Style"],"a":0,"e":"Page 2 states the formula exactly: Drawing Studio = Idea + Experiment + Technique + Production.","w":"B swaps in Sketch, Color and Texture, which are stages of making an artwork, not parts of the formula. C and D substitute ‘Tool’ or ‘Style’, which belong to the separate Tool → Technique → Style progression.","c":"Page 2, §3 (What Is the “Drawing Studio”?)"},{"q":"Which description best defines a drawing studio as presented in the lecture?","o":["A classroom in which students copy finished works in order to learn the software tools","A software environment dedicated to creating vector graphics","A working space where an idea is tested, developed with technique, and turned into a finished product","A gallery in which completed artworks are displayed and evaluated"],"a":2,"e":"The lecture defines a drawing studio as a working space where an idea is tested, developed with technique, and turned into a finished product.","w":"A reduces it to copying, B confuses it with a single program (Illustrator), and D describes a gallery rather than a working space.","c":"Page 2, §3"},{"q":"Which of the following pairs matches a component of the drawing studio with its correct meaning?","o":["Digital techniques — using drawing to express ideas and feelings","Experimentation — working with digital tools and software","Producing integrated artworks — trying different tools, lines, colors and approaches","Developing a personal style — moving from copying tools to having a recognizable artistic voice"],"a":3,"e":"Table 1, component 04: Developing a personal style means moving from copying tools to having a recognizable artistic voice.","w":"In A, B and C the meanings are shifted: A uses the meaning of component 01 (drawing and artistic expression), B uses that of 03 (digital techniques), and C uses that of 02 (experimentation).","c":"Page 2, §3, Table 1"},{"q":"All of the following are listed as components of the drawing studio EXCEPT:","o":["Experimentation","Art-history research","Digital techniques","Producing integrated artworks"],"a":1,"e":"The five components are drawing and artistic expression, experimentation, digital techniques, developing a personal style, and producing integrated artworks. Art-history research is not among them.","w":"A, C and D are all listed in Table 1.","c":"Page 2, §3, Table 1"},{"q":"Whether the work is traditional or digital, through which path does an artwork usually develop from the idea to the final work?","o":["Sketch → Construction → Color → Texture → Final Artwork","Sketch → Color → Construction → Texture → Final Artwork","Construction → Sketch → Color → Texture → Final Artwork","Sketch → Construction → Texture → Color → Final Artwork"],"a":0,"e":"Page 2 gives the path Sketch → Construction → Color → Texture → Final Artwork.","w":"B, C and D each swap the position of two stages (Color/Construction, Sketch/Construction, Texture/Color).","c":"Page 2, §4 (From Traditional Drawing to Digital Drawing)"},{"q":"Figure 1 places a line drawing beside a colored version of the same artwork. Which idea from the lecture does it illustrate?","o":["The difference between vector and raster graphics","The contrast between flat illustration and 3D illustration","The addition of texture and lighting in Photoshop","The progression from sketch to colored artwork"],"a":3,"e":"The Figure 1 caption reads ‘From sketch to colored artwork: the same drawing in line form and after coloring’, illustrating the first stages of the path from idea to final work.","w":"Vector versus raster (A) is shown in Figures 4 and 5, flat versus 3D (B) appears among the style examples, and texture and lighting in Photoshop (C) is a later stage that this figure does not show.","c":"Page 2, §4, Figure 1"},{"q":"Which statement best defines digital drawing (digital painting) as presented in the lecture?","o":["Scanning hand-drawn sketches so that they can be stored on a computer","Producing an artwork using digital tools and techniques instead of traditional tools, with the ability to control, edit and experiment with the line, the color, the texture and the composition","Applying automatic filters to a photograph so that it looks hand drawn","Using software only to color a drawing that was first made on paper"],"a":1,"e":"§4.1 defines digital drawing as producing an artwork with digital tools and techniques instead of traditional tools, with control, editing and experimentation over line, color, texture and composition.","w":"A only describes storing sketches, C describes automatic filtering of photographs, and D limits the software to coloring. Each is far narrower than the lecture’s definition.","c":"Page 2, §4.1 (What is digital drawing?)"},{"q":"A classmate argues that hand drawing is now obsolete because digital tools exist. Which position matches the lecture?","o":["Digital drawing has replaced hand drawing, because it offers better control and editing","Hand drawing is only a first stage that should be abandoned once digital work begins","They are different tools of expression, and the artist can choose, or combine, the tool that best suits the idea","The two cannot be combined within a single artwork"],"a":2,"e":"§4.2 answers ‘No’: digital and hand drawing are different tools of expression, and the artist can choose or combine the tool that suits the idea. Figure 3 shows traditional and digital tools used together.","w":"A and B claim replacement or abandonment, and D says they cannot be combined, which Figure 3 contradicts.","c":"Page 3, §4.2 (Figures 2 and 3)"},{"q":"Why does the course use two programs, Illustrator and Photoshop?","o":["Because each program suits a different way of working: Illustrator for vector graphics, Photoshop for pixels, detail and textures","Because Photoshop is the newer version that replaces Illustrator","Because Illustrator handles color while Photoshop handles shape only","Because Illustrator cannot be used for drawing on its own"],"a":0,"e":"Page 3: the course uses two programs because each suits a different way of working. Illustrator creates vector graphics that can be enlarged without loss, while Photoshop suits work based on pixels, detail and textures.","w":"B (replacement) is never claimed, C wrongly splits the programs into color versus shape, and D is false because Illustrator draws shapes, lines and paths on its own.","c":"Page 3, §5 (Why Do We Use Illustrator and Photoshop?)"},{"q":"Which set lists the main elements of Adobe Illustrator in the lecture’s comparison table?","o":["Pixels, brushes, texture, painting, photo manipulation","Shapes, lines, paths, clean edges, scalable artwork","Shapes, brushes, layers, texture, scalable artwork","Pixels, paths, clean edges, painting, photo manipulation"],"a":1,"e":"Table 2 lists Illustrator’s main elements as shapes, lines, paths, clean edges and scalable artwork.","w":"A is the Photoshop column. C and D mix items from both columns.","c":"Page 3, §5, Table 2"},{"q":"Which statement correctly compares vector and raster graphics?","o":["Vector graphics are built from pixels, so their detail is limited by the number of pixels","Raster graphics are built from paths and shapes and can be enlarged without losing the sharpness of the edges","Both vector and raster graphics keep sharp edges when enlarged, but raster files are heavier","Vector graphics are built from paths and shapes and can be enlarged without losing edge sharpness, while raster graphics are built from pixels"],"a":3,"e":"Table 3: vector graphics are built from paths and shapes and can be enlarged without losing the sharpness of the edges; raster graphics are built from pixels and their detail is limited by the number of pixels.","w":"A and B swap the two definitions. C wrongly says raster graphics keep sharp edges when enlarged.","c":"Page 4, §5.1, Table 3"},{"q":"A designer must create a company logo that will appear both on a business card and on a large billboard. Based on the lecture, which approach is most suitable, and why?","o":["Raster in Photoshop, because detail is limited by the number of pixels, which keeps edges soft at any size","Raster in Photoshop, because textures and photographs scale up without any limit","Vector in Illustrator, because paths and shapes can be enlarged without losing the sharpness of the edges","Either one, because both vector and raster graphics are enlarged without loss"],"a":2,"e":"Table 3 lists logos as suitable for vector graphics, and vector paths and shapes can be enlarged without losing the sharpness of the edges. This is essential for a design that must work at business-card and billboard sizes.","w":"A and B credit raster graphics with abilities the lecture gives to vector; in raster, detail is limited by pixels. D is false because only vector enlarges without loss.","c":"Page 4, Table 3 (with Page 3, §5)"},{"q":"Which of the following is NOT listed as suitable for raster graphics?","o":["Logos","Textures","Photographs","Digital painting"],"a":0,"e":"Table 3 lists raster as suitable for details, textures, photographs and digital painting. Illustration, logos and shapes are listed for vector.","w":"B, C and D are all explicitly listed for raster graphics.","c":"Page 4, §5.1, Table 3"},{"q":"According to the lecture, how does drawing in Illustrator develop?","o":["Construction → Shapes → Final Illustration","Sketch → Pixels → Final Illustration","Shapes → Texture → Final Illustration","Shapes → Construction → Final Illustration"],"a":3,"e":"§5.2: in Illustrator, drawing starts from simple shapes and builds up through construction to a finished illustration (Shapes → Construction → Final Illustration).","w":"A reverses the first two stages. B starts from a sketch and pixels, which are not part of this sequence. C inserts Texture, which belongs to the Photoshop stage of the workflow.","c":"Page 4, §5.2 (Drawing with shapes and lines in Illustrator)"},{"q":"In the lecture’s example, which combination of tools in Illustrator makes a face that is then developed into a full character?","o":["Circle + Pathfinder + Pencil Tool","Circle + Rectangle + Pen Tool","Rectangle + Brush + Eraser","Circle + Paintbrush + Layers"],"a":1,"e":"§5.2 example: a circle, a rectangle and the Pen Tool combine to make a face, which is then developed into a full character (Circle + Rectangle + Pen Tool → Face → Character).","w":"A, C and D use tools or elements that the example does not name (Pathfinder/Pencil, Brush/Eraser, Paintbrush/Layers).","c":"Page 4, §5.2"},{"q":"Which tool–use pair is correct according to the table of basic Illustrator tools?","o":["Pen Tool — create circular and elliptical shapes","Shape Builder — draw precise paths and curves","Pathfinder — combine, subtract and intersect shapes","Rectangle — combine and cut shapes to form new ones"],"a":2,"e":"Table 4: Pathfinder — combine, subtract and intersect shapes.","w":"A gives the Circle tool’s use to the Pen Tool, B gives the Pen Tool’s use to Shape Builder, and D gives Shape Builder’s use to Rectangle.","c":"Page 4, §5.2, Table 4"},{"q":"Besides the basic tools in the table, which other Illustrator tools does the lecture say can be used to create artwork?","o":["Curvature, Paintbrush and Pencil tools","Curvature, Blob Brush and Eyedropper tools","Brush, Eraser and Layers","Paintbrush, Eraser and Clone Stamp tools"],"a":0,"e":"Right after Table 4 the lecture says other tools can also be used to create artwork: the Curvature, Paintbrush and Pencil tools.","w":"B and D include tools the lecture never lists for Illustrator (Blob Brush, Eyedropper, Eraser, Clone Stamp). C lists Photoshop elements (Brush, Eraser, Layers), not Illustrator tools.","c":"Page 4, §5.2 (sentence after Table 4)"},{"q":"Which of the following is NOT listed among the main elements of drawing with the brush and pixels in Photoshop?","o":["Eraser","Pen Tool","Light & Shadow","Layers"],"a":1,"e":"§5.3 lists the Photoshop approach as Brush, Pencil, Eraser, Layers, Texture, Light & Shadow and Color. The Pen Tool appears in Table 4 as an Illustrator tool for precise paths and curves.","w":"A, C and D are all in the §5.3 list.","c":"Page 4, §5.3"},{"q":"In the combined Illustrator–Photoshop workflow, which output does the Photoshop step add?","o":["Vector character","The complete finished work","Sketch and construction","Texture + lighting + background"],"a":3,"e":"Table 5, step 02: Photoshop adds texture + lighting + background.","w":"A (vector character) is the Illustrator output, B (the complete finished work) is the Final Artwork row, and C belongs to the early stages in Table 6.","c":"Page 5, §5.4, Table 5"},{"q":"A student has finished a vector character in Illustrator. According to the combined workflow, what is the next step toward the final artwork?","o":["Redraw the character from scratch in Photoshop, pixel by pixel","Convert the character into a sketch and restart the stages","Move it into Photoshop to add texture, lighting and a background","Declare it the final artwork, since a vector character needs no further processing"],"a":2,"e":"Table 5 shows the workflow: Illustrator makes the vector character, Photoshop adds texture, lighting and background, and then comes the Final Artwork.","w":"A and B throw away the vector work that the workflow builds on, and D skips the Photoshop step.","c":"Page 5, §5.4, Table 5"},{"q":"Which is the correct order of the six stages of making an artwork?","o":["Sketch, Vector Drawing, Color, Drawing & Management, Texture, Final Artwork","Sketch, Color, Vector Drawing, Texture, Drawing & Management, Final Artwork","Vector Drawing, Sketch, Color, Drawing & Management, Texture, Final Artwork","Sketch, Vector Drawing, Color, Texture, Drawing & Management, Final Artwork"],"a":0,"e":"Table 6 order: Sketch, Vector Drawing, Color, Drawing & Management, Texture, Final Artwork.","w":"B puts Color before Vector Drawing and Texture before Drawing & Management, C places Vector Drawing before Sketch, and D swaps Texture and Drawing & Management.","c":"Page 5, §6, Table 6"},{"q":"In the table of stages, which stage is described as ‘Building the elements’?","o":["Sketch","Color","Drawing & Management","Vector Drawing"],"a":3,"e":"Table 6, row 02: Vector Drawing — Building the elements.","w":"Sketch is ‘the idea and the sketch’, Color is ‘choosing the color’, and Drawing & Management is ‘drawing and processing’.","c":"Page 5, §6, Table 6"},{"q":"Which progression describes the three levels the course aims to move through?","o":["Technique → Tool → Style","Tool → Technique → Style","Tool → Style → Technique","Idea → Technique → Style"],"a":1,"e":"§7: the aim of the course is to move through three levels: Tool → Technique → Style.","w":"A and C reorder the levels, and D replaces the Tool level with Idea.","c":"Page 5, §7 (From Tool to Style)"},{"q":"Three students use the same program, the same brush and the same tools, yet produce three completely different works. What does the lecture conclude?","o":["The style comes from the choices the artist makes, not from the tool used","The tool determines the style, so each style needs a different program","Only the type of brush determines the final style","The differences come mainly from mistakes in using the program"],"a":0,"e":"§7 notes that three people can use the same program, brush and tools and still produce completely different works. §7.1 adds that the tool does not create a style: the style comes from the artist’s choices.","w":"B and C make the tool decisive, which the lecture explicitly rejects. D invents a cause that the lecture never gives.","c":"Page 5, §7, and Page 6, §7.1"},{"q":"How does the lecture define an artistic style?","o":["The set of software and brushes that an artist chooses to work with","The category of a finished work, such as a poster, a logo or an illustration","The recognizable way in which an artist handles line, shape, color and subject","The technique used to transfer a sketch into a digital file"],"a":2,"e":"§7.1: an artistic style is the recognizable way in which an artist handles line, shape, color and subject.","w":"A (tools), B (type of finished work) and D (a transfer technique) do not describe the artist’s handling of line, shape, color and subject.","c":"Page 6, §7.1 (What is artistic style?)"},{"q":"Which direction of style is described as ‘brush and texture, with a presence closer to a painting’?","o":["Flat Illustration","Collage / Mixed Media","Caricature","Paint"],"a":3,"e":"Table 7: Paint — brush and texture, with a presence closer to a painting.","w":"Flat Illustration (A) is clear shapes, bold colors and a simple visual rhythm. Collage / Mixed Media (B) is layers combining photograph, vector and texture. Caricature (C) is a style in Table 8, not a direction in Table 7.","c":"Page 5, §7, Table 7"},{"q":"Which pair is correctly matched in the lecture’s three directions of style?","o":["Flat Illustration — layers that combine photograph, vector and texture","Collage / Mixed Media — layers that combine photograph, vector and texture","Paint — clear shapes, bold colors and a simple visual rhythm","Flat Illustration — brush and texture, with a presence closer to a painting"],"a":1,"e":"Table 7: Collage / Mixed Media — layers that combine photograph, vector and texture.","w":"A gives Collage’s description to Flat Illustration, C gives Flat Illustration’s description to Paint, and D gives Paint’s description to Flat Illustration.","c":"Page 5, §7, Table 7"},{"q":"Which of the following pairs from the table of common drawing styles is INCORRECT?","o":["Comics — tells a story through sequences of drawn panels","Book illustration — drawings made to accompany and enrich a written text","Flat illustration — gives the impression of volume and depth","Fashion illustration — drawings of clothing and style, often stylized figures"],"a":2,"e":"In Table 8, flat illustration uses flat shapes and colors without realistic depth. ‘Gives the impression of volume and depth’ describes 3D illustration.","w":"A, B and D match the table.","c":"Page 6, §7.1, Table 8"},{"q":"How does the lecture describe the anime style?","o":["A drawing style that originated in Japanese animation and comics","A style that exaggerates the features of a subject for humor or effect","A style that tells a story through sequences of drawn panels","A style that depicts subjects exactly as they appear in reality"],"a":0,"e":"Table 8: Anime — a drawing style that originated in Japanese animation and comics.","w":"B describes caricature, C describes comics, and D describes realistic drawing.","c":"Page 6, §7.1, Table 8"},{"q":"Which list correctly names the four models of digital drawing presented in the lecture?","o":["Flat illustration, 3D illustration, character illustration, mixed media","Realistic drawing, digital painting & illustration, comics, mixed media","Flat illustration, digital painting & illustration, caricature, collage","Flat illustration, digital painting & illustration, character illustration, mixed media"],"a":3,"e":"Table 9 lists four models: Flat Illustration, Digital Painting & Illustration, Character Illustration and Mixed Media.","w":"A includes 3D illustration, and B includes realistic drawing and comics: these are styles from Table 8, not models. C includes caricature (a Table 8 style) and collage (a Table 7 direction).","c":"Page 7, §8, Table 9 (Models of Digital Drawing)"},{"q":"Which of the four models of digital drawing is described as ‘Photo + vector + digital painting + texture’?","o":["Flat Illustration","Mixed Media","Character Illustration","Digital Painting & Illustration"],"a":1,"e":"Table 9, model 04: Mixed Media — Photo + vector + digital painting + texture.","w":"A is ‘simple shapes and clear colors’, C is ‘building characters and expressions’, and D is ‘closer to traditional painting’.","c":"Page 7, §8, Table 9"},{"q":"In the class discussion, each student chooses the type of digital drawing closest to them and gives a reason. What purpose does the lecture give for this activity?","o":["It helps later to understand the students’ inclinations","It determines which program each student will study first","It is used to grade each student’s starting drawing level","It assigns students to groups for the final project"],"a":0,"e":"The lecture states that this activity helps later to understand the students’ inclinations.","w":"B, C and D (program order, grading, grouping) are not stated anywhere in the lecture.","c":"Page 7, §8 (class discussion note)"},{"q":"Which row of the semester plan is correct?","o":["Weeks 1–6 — Photoshop — digital drawing, textures and processing","Weeks 7–11 — Illustrator — vector drawing, composition and characters","Weeks 12–14 — Final Project — integrating Illustrator and Photoshop","Weeks 1–6 — Final Project — integrating Illustrator and Photoshop"],"a":2,"e":"Table 10: Weeks 12–14 are the Final Project, integrating Illustrator and Photoshop.","w":"A and B swap the programs of the first two rows (Illustrator is Weeks 1–6, Photoshop is Weeks 7–11), and D gives the Final Project label to Weeks 1–6.","c":"Page 7, §9, Table 10"},{"q":"How does the lecture describe the progression of the semester?","o":["Texture first, then building the form, and finally coloring","Photoshop painting first, then Illustrator, then a presentation","Style discovery first, then the tools, then the building of form","Building the form first, then drawing, coloring and texture, and finally one artistic project that brings the skills together"],"a":3,"e":"The closing sentences of §9 say that the focus starts with building the form, then moves to drawing, coloring and texture, and finally brings all these skills together in one artistic project. This is consistent with Table 10.","w":"A, B and C reorder or invent the sequence.","c":"Page 8 (closing sentences of §9; plan in Table 10 on Page 7)"},{"q":"In the opening activity, what does each student answer about themselves?","o":["Their name and their favorite drawing software","Their name, and whether drawing is one of their hobbies and whether they still practice it","Their name and the grade they received in their previous art course","Their name and which program, Illustrator or Photoshop, they expect to prefer"],"a":1,"e":"§1: each student answers two questions: what is your name, and is drawing one of your hobbies and do you still practice it.","w":"A, C and D invent different questions (favorite software, previous grade, program preference).","c":"Page 1, §1 (Getting to Know Each Other)"},{"q":"A student keeps trying different tools, line weights and color approaches before committing to a final idea. Which component of the drawing studio is she mainly practicing?","o":["Experimentation","Developing a personal style","Digital techniques","Producing integrated artworks"],"a":0,"e":"Table 1, component 02: Experimentation means trying different tools, lines, colors and approaches.","w":"Developing a personal style (B) is having a recognizable artistic voice, Digital techniques (C) is working with digital tools and software, and Producing integrated artworks (D) is finishing complete works.","c":"Page 2, §3, Table 1"},{"q":"A student enlarges a small pixel-based image and its detail does not hold up. Which statement from the lecture explains this?","o":["Raster images are built from paths and shapes, which cannot be recalculated","Raster images are suitable only for logos and simple shapes","In raster graphics, detail is limited by the number of pixels","Raster images cannot contain texture"],"a":2,"e":"Table 3: in raster graphics, detail is limited by the number of pixels, so an enlarged pixel-based image cannot keep its detail.","w":"A gives raster the construction of vector (paths and shapes). B and D are false: raster is suited to details, textures, photographs and digital painting.","c":"Page 4, §5.1, Table 3"},{"q":"Which statement accurately reflects the lecture’s summary?","o":["Digital drawing replaces traditional drawing because it gives more control over line and color","Illustrator works with raster images, while Photoshop works with vectors","A style is created by the tool that the artist selects","The two programs can be combined: a vector character from Illustrator, then texture, lighting and background in Photoshop"],"a":3,"e":"The summary states that the two programs can be combined: a vector character from Illustrator, then texture, lighting and background in Photoshop, to reach the final artwork.","w":"A contradicts §4.2 (digital drawing does not replace traditional drawing), B swaps vector and raster, and C contradicts §7.1 (the tool does not create a style).","c":"Page 8, §10 (Summary)"},{"q":"According to the caption of Figure 5, how is the same kind of image presented?","o":["Raster (top left) and vector (bottom right)","Vector (top left) and raster pixels (bottom right)","Flat illustration (top left) and 3D illustration (bottom right)","Sketch (top left) and colored artwork (bottom right)"],"a":1,"e":"The Figure 5 caption: the same kind of image drawn as vector (top left) and as raster pixels (bottom right).","w":"A reverses the positions, while C and D describe other figures (style examples and sketch-to-color).","c":"Page 4, §5.1, Figure 5"},{"q":"What is the key difference between flat illustration and 3D illustration as defined in the lecture?","o":["Flat illustration exaggerates features for humor, while 3D illustration depicts subjects as they appear in reality","Flat illustration is made only in Photoshop, while 3D illustration is made only in Illustrator","Flat illustration uses flat shapes and colors without realistic depth, while 3D illustration gives the impression of volume and depth","Flat illustration tells a story through panels, while 3D illustration accompanies a written text"],"a":2,"e":"Table 8: flat illustration uses flat shapes and colors without realistic depth, while 3D illustration gives the impression of volume and depth.","w":"A attributes caricature and realistic drawing to the wrong styles, B invents a program restriction, and D describes comics and book illustration.","c":"Page 6, §7.1, Table 8"},{"q":"Besides drawing tools such as the Brush and the Pencil, what other tools does the lecture say Photoshop contains?","o":["Tools for color processing, blending and editing","Tools for building precise vector paths and curves","Tools for combining, subtracting and intersecting shapes","Tools limited to photographs only"],"a":0,"e":"§5.3: Photoshop has drawing tools such as the Brush and the Pencil, as well as tools for color processing, blending and editing.","w":"B and C describe Illustrator tools (Pen Tool, Pathfinder). D is not stated: Table 2 lists brushes, texture and painting as well as photo manipulation.","c":"Page 4, §5.3"},{"q":"By the end of the course, each student should begin to discover which question?","o":["Which of the two programs suits me best?","How can I reproduce the style of a famous artist accurately?","Which of the four drawing models is the easiest to master?","“What is my own style?”"],"a":3,"e":"§7: by the end of the course, each student should begin to discover ‘What is my own style?’","w":"A, B and C are not stated. B also contradicts the aim of building a personal style rather than imitating one.","c":"Page 5, §7"},{"q":"Which statement about the Pencil and Paintbrush tools is consistent with the lecture?","o":["The Pencil tool is mentioned only among Photoshop’s drawing tools","The Pencil tool is mentioned both among the other tools Illustrator can use and among Photoshop’s drawing tools","The Paintbrush tool is mentioned only for Photoshop, while the Brush belongs to Illustrator","Illustrator is limited to the Circle, Rectangle, Pen Tool, Shape Builder and Pathfinder"],"a":1,"e":"Page 4 names the Pencil among the other tools Illustrator can use (Curvature, Paintbrush, Pencil), and §5.3 names the Pencil among Photoshop’s drawing tools. It therefore appears in both.","w":"A is false because of the Illustrator mention, C is false because the Paintbrush is listed for Illustrator, and D is false because the lecture says other tools can also be used.","c":"Page 4, §5.2 and §5.3"},{"q":"In the table of stages, which stage comes immediately after Color?","o":["Texture","Vector Drawing","Drawing & Management","Final Artwork"],"a":2,"e":"Table 6 order: 03 Color, then 04 Drawing & Management, then 05 Texture.","w":"Texture (A) comes after Drawing & Management, Vector Drawing (B) comes before Color, and Final Artwork (D) is last.","c":"Page 5, §6, Table 6"},{"q":"An artist makes drawings to accompany and enrich a written text. Which style from the table of common drawing styles does this match?","o":["Book illustration","Comics","Fashion illustration","Caricature"],"a":0,"e":"Table 8: Book illustration — drawings made to accompany and enrich a written text.","w":"Comics (B) tell a story through sequences of drawn panels, Fashion illustration (C) shows clothing and style, and Caricature (D) exaggerates features.","c":"Page 6, §7.1, Table 8"},{"q":"A student has completed many separate exercises but has no finished piece to show. Which component of the drawing studio does her work still lack?","o":["Drawing and artistic expression","Experimentation","Digital techniques","Producing integrated artworks"],"a":3,"e":"Table 1, component 05: Producing integrated artworks means finishing complete works, not only exercises.","w":"Drawing and artistic expression (A) is using drawing to express ideas, Experimentation (B) is trying different approaches, and Digital techniques (C) is working with digital tools and software.","c":"Page 2, §3, Table 1"},{"q":"Which task would the lecture assign to Photoshop rather than Illustrator?","o":["Building clean-edged shapes and paths","Adding texture and painting detail with brushes","Constructing a face from a circle, a rectangle and the Pen Tool","Producing a scalable logo"],"a":1,"e":"Table 2 and §5.3 give Photoshop pixels, brushes, texture, painting and photo manipulation, so adding texture and painting detail with brushes is a Photoshop task.","w":"A, C and D describe Illustrator work: clean edges and paths, building a face from a circle, rectangle and Pen Tool, and scalable logos.","c":"Page 3, Table 2, and Page 4, §5.3"}],[{"q":"According to the lecture’s structure, what does Part Two cover?","o":["The eight elements of design","The principles of design and spatial relationships","Basic geometric shapes and how they are used in design","Color models and negative space"],"a":2,"e":"The introduction says Part One covers the eight elements of design, and Part Two reviews the basic geometric shapes and shows how they are used in design.","w":"A) That is Part One. B) These appear in the appendix chart and in the separate slides, not as Part Two. D) Both are treated inside Part One (§2.7 and §2.8).","c":"Notes, Page 1, §1 (Introduction)"},{"q":"Which of the following is NOT one of the eight elements of design named in the lecture?","o":["Point","Rhythm","Texture","Space"],"a":1,"e":"The eight elements are point, line, shape (area), volume (size), texture, light and shade, color and space. Rhythm is a principle of design (appendix chart), not an element.","w":"A) Listed as the first element. C) Listed as the fifth element. D) Listed as the eighth element.","c":"Notes, Page 1, §1; Page 14, chart B"},{"q":"After studying the material, which of the following should the student be able to do?","o":["Classify lines into simple and compound types","Classify colors into primary and tertiary families","Calculate the area of geometric shapes with formulas","Classify textures into hot and cold types"],"a":0,"e":"The learning objectives include classifying lines into simple and compound types.","w":"B) Not among the learning objectives. C) The lecture treats shapes visually; there are no area calculations. D) Textures are classified as actual or illusory; temperature applies to color.","c":"Notes, Page 1 (Learning objectives)"},{"q":"Which element–nature pair matches the table of short definitions?","o":["Point — One-dimensional","Volume / Size — Surface quality","Color — Tonal","Shape / Area — Two-dimensional"],"a":3,"e":"In the table of short definitions, the nature of Shape / Area is two-dimensional: a flat, enclosed region with length and width.","w":"A) The nature of a point is ‘Position’; ‘One-dimensional’ belongs to Line. B) ‘Surface quality’ is the nature of Texture; Volume is three-dimensional. C) Color is ‘Optical’; ‘Tonal’ belongs to Light and Shade (Value).","c":"Notes, Page 2, §2 (table of short definitions)"},{"q":"How does the lecture define the point in geometry and in design?","o":["In geometry it has a small circular size; in design it is any large shape","In geometry it has no length, width or depth and only indicates a position; in design it is any small mark the eye reads as a single unit","In geometry it has length but no width; in design it is a dot only","In geometry it marks the end of a line; in design it is a color accent"],"a":1,"e":"§2.1 states exactly this: a geometric point has no length, width or depth and only indicates a position, while in a design it is any small mark read as a single unit, such as a dot, a speck or a small circle.","w":"A) A geometric point has no size at all, and in design the point is a small mark, not a large shape. C) A geometric point has no length at all, and the design point covers any small mark (a dot, a speck or a small circle). D) The lecture never defines the point this way.","c":"Notes, Page 2, §2.1"},{"q":"Which statement about points is INCORRECT?","o":["A single point marks a location and attracts the eye","Several points placed close together in a row are read as a line","Points arranged to enclose an area are read as a shape","Many points of different size or density always produce a flat, uniform area with no tone or texture"],"a":3,"e":"The lecture says the opposite: many points of different size or density produce tone and texture.","w":"A) Stated in the key characteristics. B) Stated in the key characteristics. C) Stated in the key characteristics.","c":"Notes, Page 2, §2.1 (Key characteristics)"},{"q":"Which group lists typical applications of designs based on the point?","o":["Dot patterns, stippling, halftone printing and pointillism","Zigzags, spirals, braids and converging lines","Perspective, overlapping, shading and isometric projection","Grids, flyers, posters and identity design"],"a":0,"e":"§2.1 names dot patterns, stippling in illustration, halftone printing and pointillism in painting.","w":"B) Those are line types (Table 1). C) Those are ways of implying volume (§2.4). D) Those relate to the use of geometric shapes (§3.3).","c":"Notes, Page 2, §2.1 (Designs based on the point)"},{"q":"Which pairing of line direction and its suggested feeling is correct?","o":["Horizontal — movement and tension","Vertical — calm and stability","Diagonal — movement and tension","Diagonal — height, strength and growth"],"a":2,"e":"§2.2: diagonal lines suggest movement and tension.","w":"A) Horizontal lines suggest calm and stability. B) Vertical lines suggest height, strength and growth. D) That belongs to vertical lines.","c":"Notes, Page 3, §2.2 (Properties of lines)"},{"q":"How does the lecture distinguish simple lines from compound lines?","o":["A simple line keeps one basic form, either straight or non-straight; a compound line is built on a straight line, a non-straight line, or a combination of both","A simple line is always horizontal; a compound line is always curved","A simple line is drawn freehand; a compound line is constructed with instruments","A simple line has one color; a compound line has several"],"a":0,"e":"§2.2.1 gives exactly this distinction.","w":"B) Simple lines include straight and non-straight forms, and compound lines are not always curved. C) That contrast is between free lines and geometric lines, not simple and compound. D) Color is not the basis of the classification.","c":"Notes, Page 3, §2.2.1"},{"q":"Which line type belongs to the compound lines based on the non-straight line?","o":["Broken (zigzag)","Perpendicular","Spiral","Converging"],"a":2,"e":"Table 1 lists winding, spiral, wavy and coiled (helical) lines as compound lines based on the non-straight line.","w":"A) Based on the straight line. B) Based on the straight line. D) Listed in the group based on a straight line, a non-straight line, or a combination of both.","c":"Notes, Page 3, Table 1"},{"q":"Which definition from the notes on selected line types is INCORRECT?","o":["Spiral — a curve that winds around a center point while moving away from it","Coiled (helical) line — a curve that loops repeatedly around an axis, like a spring","Tangent lines — lines or curves that touch at a single point without crossing","Converging lines — lines that keep the same distance from each other and never meet"],"a":3,"e":"That describes parallel lines. Converging lines approach each other and meet at a point.","w":"A) Matches the lecture. B) Matches the lecture. C) Matches the lecture.","c":"Notes, Page 3 (Notes on selected types)"},{"q":"Which approach to using lines is described as using very few lines to suggest a subject?","o":["Flowing curved lines describing a face","Minimal line art","Parallel lines bending over a form to create relief","Straight lines forming angular facets"],"a":1,"e":"§2.2.2: at the opposite extreme from faceted forms, minimal line art uses very few lines to suggest a subject (Figure 4, a flower).","w":"A) Uses many curved lines to describe form. C) Uses many parallel lines. D) Divides the surface into angular facets; it is the opposite extreme from minimal line art.","c":"Notes, Page 4, §2.2.2"},{"q":"According to §2.2.2, many curved or parallel lines placed side by side can describe a face or a landscape. What do the spacing and bending of the lines suggest?","o":["Light, depth and surface relief","Calm and stability only","Tone and halftone dots","Rhythm and unity of repeated shapes"],"a":0,"e":"The lecture says the spacing and bending of the lines suggest light, depth and surface relief (Figures 1 and 2).","w":"B) That is the mood of horizontal lines, not the effect of spacing and bending. C) Halftone belongs to designs based on points. D) That is an effect of repeating shapes (§2.3).","c":"Notes, Page 4, §2.2.2 (Figures 1–2)"},{"q":"When is a shape created, according to the lecture?","o":["When several parallel lines are placed side by side","When a single point is placed on the page","When a form has length, width and depth","When a line closes on itself, or when an area is separated from its background by a difference in color, tone or texture"],"a":3,"e":"§2.3 gives both conditions for creating a shape.","w":"A) That describes a way of using lines to build form. B) A single point marks a position. C) That describes volume, the three-dimensional counterpart of shape.","c":"Notes, Page 4, §2.3"},{"q":"Which description matches free (organic) shapes?","o":["Regular shapes defined by mathematical rules that look ordered, precise and man-made","Three-dimensional solids with length, width and depth","Irregular, often curved shapes that resemble forms found in nature, such as leaves, clouds or pebbles, and look spontaneous and informal","Shapes made only from straight lines and facets"],"a":2,"e":"§2.3 describes free (organic) shapes exactly this way.","w":"A) That describes geometric shapes. B) That describes volumes. D) The lecture describes free shapes as irregular and often curved.","c":"Notes, Page 4, §2.3"},{"q":"Which statement about using areas in design is correct?","o":["Large areas work as accents, while small areas establish the background","The relationship between a shape and the space around it (figure and ground) determines what the viewer notices first","Overlapping shapes flatten the composition","Repeating shapes of the same type weakens unity"],"a":1,"e":"Page 5: the relationship between a shape and the space around it (figure and ground) determines what the viewer notices first.","w":"A) Reversed: large areas establish the background and overall structure; small areas work as accents. C) Overlapping shapes create a sense of depth. D) Repeating shapes of the same type creates rhythm and unity.","c":"Notes, Page 5, §2.3 (Using areas in design)"},{"q":"Which pair completes the statement correctly? ‘Overlapping shapes create ____, and repeating shapes of the same type creates ____.’","o":["A sense of depth; rhythm and unity","Tension; contrast","Texture; emphasis","Color; balance"],"a":0,"e":"Page 5: overlapping shapes create a sense of depth, and repeating shapes of the same type creates rhythm and unity.","w":"B) Neither effect is stated for these actions in §2.3. C) Neither effect is stated for these actions in §2.3. D) Neither effect is stated for these actions in §2.3.","c":"Notes, Page 5, §2.3 (Using areas in design)"},{"q":"On a flat surface, volume can be implied by using which techniques?","o":["Stippling, halftone and pointillism","Hue, value and intensity","Proximity, penetration and tangent lines","Perspective, overlapping, shading and isometric projection"],"a":3,"e":"§2.4 lists perspective, overlapping, shading and isometric projection as the ways to imply volume on a flat surface.","w":"A) These are applications of points. B) These are properties of color, not techniques for implying volume. C) Spatial relationships and a line type, not the techniques named for implying volume.","c":"Notes, Page 6, §2.4"},{"q":"What do differences in size create, according to the lecture?","o":["Texture, tone and mood","Unity, rhythm and balance","Scale, hierarchy and emphasis","Hue, value and intensity"],"a":2,"e":"§2.4: differences in size create scale, hierarchy and emphasis; the largest element usually dominates, while small elements are read as details.","w":"A) Those are effects of texture and of light and shade. B) Principles of design, not stated as the result of size differences. D) Properties of color.","c":"Notes, Page 6, §2.4"},{"q":"Which of the following is an example where volume is real because the object occupies physical space?","o":["A pencil sketch of a cube drawn in perspective","A sculpture","A flat poster showing a shaded sphere","An isometric drawing of a building"],"a":1,"e":"§2.4: volume can be real, as in sculpture, architecture and product design, where the object occupies physical space.","w":"A) Volume is only implied on a flat surface. C) Shading only implies volume. D) Isometric projection only implies volume on a flat surface.","c":"Notes, Page 6, §2.4"},{"q":"Which example is an illusory (visual) texture?","o":["Wood grain that can be felt with the hand","A woven fabric","A printed relief","A painting or digital effect that imitates the look of a surface that is not physically there"],"a":3,"e":"§2.5: illusory textures are only seen; they are created by drawing, painting, photography or digital effects to imitate a surface that is not physically there.","w":"A) Actual texture. B) Actual texture. C) Actual texture.","c":"Notes, Page 6, §2.5"},{"q":"Which set matches the artificial textures shown in Figure 8?","o":["Gradients, paper, foil and marbled effects","Water, stone, fabric and grass","Bamboo, wood, paper and leaf","Dot patterns, stippling and halftone"],"a":0,"e":"The Figure 8 caption reads: artificial textures (gradients, paper, foil and marbled effects).","w":"B) Organic textures (Figure 7). C) Organic textures (Figure 7). D) Designs based on points, not the textures of Figure 8.","c":"Notes, Page 7, Figures 7–8"},{"q":"Which of the following is NOT a function of light and shade listed in the lecture?","o":["Modeling form","Creating depth","Defining color temperature","Setting mood"],"a":2,"e":"The four functions are modeling form, creating depth, focusing attention and setting mood. Temperature (warm or cool) is a property of color (§2.7).","w":"A) Listed: gradual changes from highlight to shadow reveal volume. B) Listed: lighter areas advance and darker areas recede. D) Listed: light tones feel open and calm, dark tones dramatic and serious.","c":"Notes, Page 7, §2.6"},{"q":"A composition is dominated by dark tones. Which mood does the lecture associate with it?","o":["Open and calm","Dramatic and serious","Informal and spontaneous","Stable and reliable"],"a":1,"e":"§2.6: a composition dominated by dark tones feels dramatic and serious.","w":"A) Associated with compositions dominated by light tones. C) The lecture associates this with free shapes. D) The lecture associates this with squares and rectangles.","c":"Notes, Page 7, §2.6"},{"q":"In a drawing, the eye goes first to the area of strongest contrast between light and dark. Which function of light and shade is this?","o":["Focusing attention","Modeling form","Creating depth","Setting mood"],"a":0,"e":"§2.6: the area of strongest contrast between light and dark draws the eye first, which is the function of focusing attention.","w":"B) Gradual changes from highlight to shadow reveal volume. C) Lighter areas advance and darker areas recede. D) Light tones feel open and calm; dark tones dramatic and serious.","c":"Notes, Page 7, §2.6"},{"q":"In color work, what does adding white to a color produce, and what does adding black produce?","o":["A shade; a tint","A hue; a shade","A tint; a hue","A tint (a lighter value); a shade (a darker value)"],"a":3,"e":"§2.6: adding white produces a tint (a lighter value), and adding black produces a shade (a darker value).","w":"A) Reversed. B) A hue is the name of the color, not the result of adding white. C) Adding black produces a shade, not a hue.","c":"Notes, Page 7, §2.6 (also Page 14, chart A)"},{"q":"Which pairing of color property and meaning is correct?","o":["Hue — how light or dark the color is","Value — the name of the color, such as red, green or blue","Intensity (saturation) — how pure or strong the color is, as opposed to dull or greyed","Intensity — whether the color is warm or cool"],"a":2,"e":"§2.7 defines intensity (saturation) as how pure or strong the color is, as opposed to dull or greyed.","w":"A) That is value. B) That is hue. D) Warm or cool is temperature.","c":"Notes, Page 7, §2.7"},{"q":"Which group lists only warm colors according to the lecture?","o":["Reds, blues and greens","Reds, oranges and yellows","Yellows, greens and blues","Oranges, blues and greens"],"a":1,"e":"§2.7: reds, oranges and yellows are warm, while blues and greens are cool.","w":"A) Blues and greens are cool. C) Greens and blues are cool. D) Blues and greens are cool.","c":"Notes, Page 7, §2.7"},{"q":"Which statement correctly describes the RGB model?","o":["It is subtractive: inks absorb light, and its primaries are cyan, magenta, yellow and key","It is additive, and combining all primaries gives black","It is subtractive and is used for posters, books and packaging","It is additive: light is added to light, and combining all primaries gives white"],"a":3,"e":"Table 2: RGB is additive (light is added to light), and combining all its primaries gives white.","w":"A) That describes CMYK. B) Combining all RGB primaries gives white. C) RGB is additive and is used for screens; print uses CMYK.","c":"Notes, Page 8, Table 2"},{"q":"Which pair from the RGB/CMYK comparison table is INCORRECT?","o":["CMYK, result of combining all primaries — white","RGB secondary colors — yellow, cyan, magenta","CMYK secondary colors — red, green, blue","RGB typical use — screens: websites, apps, video, digital presentations"],"a":0,"e":"In CMYK, combining all primaries gives black in theory (the black ink K is added in practice). White is the RGB result.","w":"B) Matches Table 2. C) Matches Table 2. D) Matches Table 2.","c":"Notes, Page 8, Table 2"},{"q":"A designer prepares a bright design in RGB and later converts it to CMYK for a printed poster. What does the lecture warn about?","o":["The colors will always become brighter in print","The artwork will automatically turn into a vector file","Some bright screen colors cannot be reproduced exactly in print, so colors may shift","Nothing changes, since RGB and CMYK reproduce identical colors"],"a":2,"e":"The practical note says a print design should be prepared in CMYK and a screen design in RGB, because some bright screen colors cannot be reproduced exactly in print and colors may shift when converted.","w":"A) The lecture warns of a shift because some screen colors cannot be reproduced in print; it never says they get brighter. B) Color conversion has nothing to do with vector conversion. D) The lecture explicitly says colors may shift.","c":"Notes, Page 8 (Practical note)"},{"q":"Which statement correctly defines positive and negative space?","o":["Positive space is the empty area around the subjects; negative space is the area occupied by the main subject","Positive space is the area occupied by the main subject or elements; negative space is the empty area around and between the subjects","Positive space is the lighter part of a composition; negative space is the darker part","Positive space is the foreground color; negative space is the background color"],"a":1,"e":"§2.8 defines the two kinds of space exactly this way.","w":"A) Reversed. C) The lecture defines space by occupation, not by tone. D) Not how the lecture defines them.","c":"Notes, Page 8, §2.8"},{"q":"What does the lecture say skilled designers can do with negative space?","o":["Fill it with decoration so that no space is wasted","Remove it to maximize legibility","Use it only as a plain background color","Use it actively so that the empty area itself forms a second image or letter, giving a design with a double meaning"],"a":3,"e":"§2.8: skilled designers use negative space actively, so the empty area can form a second image or letter and produce a double meaning (Figures 10–13).","w":"A) The lecture says negative space is not wasted space. B) Negative space improves clarity and legibility rather than reducing them. C) Skilled designers use it actively, as in Figures 10–13.","c":"Notes, Page 8, §2.8 (examples on Page 9, Figures 10–13)"},{"q":"Which of the following is NOT a benefit of negative space stated in the lecture?","o":["It increases the physical volume of the objects","It gives the eye a place to rest","It improves clarity and legibility","It separates groups of elements"],"a":0,"e":"§2.8 says negative space gives the eye a place to rest, improves clarity and legibility, and separates groups of elements. Nothing is said about increasing volume.","w":"B) Stated. C) Stated. D) Stated.","c":"Notes, Page 8, §2.8"},{"q":"Which group–shape pairing is correct according to the table of basic shape groups?","o":["Triangles — triangle, trapezium, rhombus","Curved shapes — circle, ellipse","Quadrilaterals — square, rectangle, right triangle","Regular polygons — pentagon, hexagon, four-pointed star"],"a":1,"e":"Table 3 lists the curved shapes as circle and ellipse.","w":"A) The trapezium and the rhombus are quadrilaterals. C) The right triangle belongs to the triangles group. D) The four-pointed star belongs to the stars group.","c":"Notes, Page 10, §3.1, Table 3"},{"q":"Which shape is listed among the quadrilaterals?","o":["Scalene triangle","Pentagon","Rhombus","Ellipse"],"a":2,"e":"Table 3: quadrilaterals are the square, rectangle, parallelogram, trapezium and rhombus.","w":"A) Belongs to the triangles group. B) Belongs to the regular polygons. D) Belongs to the curved shapes.","c":"Notes, Page 10, Table 3"},{"q":"Why does the lecture call geometric shapes the simplest and most widely used shapes in design?","o":["Because they are easy to recognize, to combine and to repeat","Because they resemble forms found in nature","Because they look spontaneous and informal","Because they avoid any contrast of size or color"],"a":0,"e":"§3: geometric shapes are the simplest and most widely used shapes in design because they are easy to recognize, to combine and to repeat.","w":"B) That describes free (organic) shapes. C) That describes free shapes. D) Contrast of size and color is one of the main ways of using them (§3.3).","c":"Notes, Page 10, §3"},{"q":"Which pairing of shape and typical visual character is correct?","o":["Circle — stability, order and reliability","Square and rectangle — completeness and smooth movement","Circle — tense and dynamic","Triangle — direction and energy"],"a":3,"e":"Table 4: the triangle suggests direction and energy.","w":"A) Those belong to the square and rectangle. B) Those belong to the circle. C) A circle suggests completeness, unity, continuity and smooth movement.","c":"Notes, Page 11, Table 4"},{"q":"A designer rests a triangle on its base in one poster and balances it on a point in another. How does the lecture say the two will feel?","o":["Resting on its base: tense and dynamic; balanced on a point: stable","Resting on its base: stable; balanced on a point: tense and dynamic","Both feel complete, unified and continuous","Both feel solid, ordered and reliable"],"a":1,"e":"Table 4: a triangle resting on its base feels stable, while one balanced on a point feels tense and dynamic.","w":"A) Reversed. C) That describes the circle. D) That describes squares and rectangles.","c":"Notes, Page 11, Table 4"},{"q":"How does the lecture describe the visual-character associations of the basic shapes?","o":["As universal laws that never vary","As rules that apply only to Bauhaus-style design","As general conventions that may vary with context and culture","As properties that depend only on a shape’s color"],"a":2,"e":"§3.2: designers commonly associate each basic shape with a visual character, but these associations are general conventions and may vary with context and culture.","w":"A) The lecture says they may vary. B) Not stated; the lecture treats them as general conventions. D) The lecture links the character to the shape itself, not to its color.","c":"Notes, Page 10, §3.2"},{"q":"Which way of using geometric shapes is described as pairing large and small shapes, and bold color blocks, to create emphasis and a clear focal point?","o":["Contrast of size and color","Repetition and pattern","Combination and overlap","Grid-based layout"],"a":0,"e":"§3.3 describes contrast of size and color in exactly these terms.","w":"B) Builds rhythm and a unified look. C) Joining, cutting and overlapping shapes to create more complex forms. D) Gives a precise, balanced composition.","c":"Notes, Page 11, §3.3"},{"q":"Which statement about the Bauhaus is correct?","o":["It was a school founded in France in 1919 that promoted free, organic shapes","It was a movement founded in Germany in 1939 that promoted texture","It was a school that promoted richly ornamented forms in architecture only","It was a school founded in Germany in 1919 that promoted simplified forms and primary shapes in graphic design, architecture and product design"],"a":3,"e":"§3.3: geometric composition was a central idea of the Bauhaus school, founded in Germany in 1919, which promoted simplified forms and primary shapes in graphic design, architecture and product design.","w":"A) It was founded in Germany, and it promoted simplified forms and primary shapes. B) The date is 1919, and the focus was simplified forms and primary shapes. C) It promoted simplified forms across graphic design, architecture and product design.","c":"Notes, Page 11, §3.3"},{"q":"In the appendix chart of elements, how are shape and form distinguished?","o":["Shape is three-dimensional, while form is flat","Shape is two-dimensional (flat), while form is three-dimensional","Shape is always geometric, while form is always organic","They are the same element under two names"],"a":1,"e":"Appendix A: shape is two-dimensional (flat), and form is three-dimensional.","w":"A) Reversed. C) Both shape and form can be geometric or organic. D) The chart lists them as separate elements.","c":"Notes, Page 14, Appendix A"},{"q":"Which principle in the appendix chart is described as placing different elements side by side, for example rough and smooth textures or dark and light values, to highlight their differences and create a focal point?","o":["Harmony","Pattern","Contrast","Balance"],"a":2,"e":"Appendix B describes contrast as the juxtaposition of different elements to highlight their differences, create visual interest or form a focal point.","w":"A) Harmony arranges elements so that all the parts form a coherent whole. B) Pattern is a regular arrangement of alternated or repeated elements or motifs. D) Balance is a feeling of equality in weight or importance.","c":"Notes, Page 14, Appendix B"},{"q":"Which list gives the five kinds of rhythm described in the appendix chart?","o":["Random, regular, alternating, progressive and flowing","Random, symmetrical, alternating, radial and flowing","Regular, irregular, progressive, repeated and static","Alternating, symmetrical, radial, random and progressive"],"a":0,"e":"Appendix B names five kinds of rhythm: random, regular, alternating, progressive and flowing.","w":"B) Symmetrical and radial are not among the five kinds. C) Irregular, repeated and static are not named. D) Symmetrical and radial are not named.","c":"Notes, Page 14, Appendix B"},{"q":"According to the slides, which pair of principle and definition is correct?","o":["Unity — the visual movement created by repeating elements in a predictable pattern","Rhythm — the harmonious arrangement of elements that makes a design feel whole and completed","Emphasis / Dominance — the equal distribution of visual weight to create stability","Proportion — the size relationship between different elements and how they scale compared to each other"],"a":3,"e":"The slides define proportion as the size relationship between different elements and how they scale compared to each other.","w":"A) That defines rhythm. B) That defines unity. C) That defines balance.","c":"Slides, Pages 1–2"},{"q":"In the slides, which principle is the focal point of a design that captures the viewer’s attention first?","o":["Unity","Emphasis / Dominance","Balance","Proportion"],"a":1,"e":"The slides define emphasis / dominance as the focal point of a design that captures the viewer’s attention first.","w":"A) Makes the design feel whole and completed. C) Equal distribution of visual weight to create stability. D) The size relationship between different elements.","c":""},{"q":"Which pair of spatial relationship and definition is correct according to the slides?","o":["Overlapping — joining two shapes where their flat surfaces meet completely","Face-to-face contact — passing one solid form directly through another","Proximity — placing objects close to each other to show a visual relationship or connection","Penetration — connecting two objects barely at their points, edges or vertices"],"a":2,"e":"The slides define proximity as placing objects close to each other to show a visual relationship or connection.","w":"A) That is face-to-face contact. B) That is penetration. D) That is corner-to-corner contact.","c":"Slides, Pages 2–3"},{"q":"Which spatial relationship merges or intertwines objects so that they share a common internal space?","o":["Overlapping","Penetration","Corner-to-corner contact","Interpenetration"],"a":3,"e":"The slides define interpenetration as merging or intertwining objects together so that they share a common internal space.","w":"A) One object is positioned over another to create layers and depth. B) One solid form passes directly through another, creating a dramatic intersection. C) Two objects connect barely at their points, edges or vertices.","c":""},{"q":"A designer positions one object over another to create a sense of layers and depth. Which spatial relationship is this?","o":["Overlapping","Proximity","Face-to-face contact","Corner-to-corner contact"],"a":0,"e":"The slides define overlapping as positioning one object over another to create a sense of layers and depth.","w":"B) Placing objects close together to show a connection. C) Flat surfaces or faces meet completely. D) Objects touch only at points, edges or vertices.","c":""}],[{"q":"How do you start a new document in Adobe Illustrator?","o":["Edit > New Layer","Object > New","File > New (Ctrl/Cmd + N)","Window > New File"],"a":2,"e":"A new document is created with File > New (Ctrl/Cmd + N), or with the Create new button on the Home screen.","w":"A layer is not a document, and neither the Object menu nor the Window menu is where files are started.","c":"Lecture 3 | Starting a New Document | sample question (quiz Q1)"},{"q":"In the New Document dialog, which color mode is the right choice for a design shown on screens (web, social media)?","o":["CMYK","RGB","Grayscale","Bitmap"],"a":1,"e":"RGB is the additive, light-based mode used for screens.","w":"CMYK is the print mode; Grayscale and Bitmap are not the modes the lecture assigns to screen work.","c":"Lecture 3 | Color Modes (RGB / CMYK) | sample question (quiz Q2)"},{"q":"Which color mode is normally chosen for a design that will be printed?","o":["RGB","Web safe","Indexed","CMYK"],"a":3,"e":"CMYK matches the inks used in print.","w":"RGB is for screens; Web safe and Indexed are screen/web-oriented options, not the print mode.","c":"Lecture 3 | Color Modes (RGB / CMYK) | sample question (quiz Q3)"},{"q":"All of the following are set in the New Document dialog before clicking Create EXCEPT:","o":["The stroke weight of the shapes you will draw later","The Width and Height of the artboard","The Units and the Orientation","The color mode (RGB or CMYK)"],"a":0,"e":"Width, Height, Units, Orientation and Number of Artboards are set in the New Document dialog, and the color mode is chosen there too. Stroke weight is set later in the Stroke panel or the Properties panel.","w":"Size, units, orientation and color mode are all real New Document settings, so they are not the exception.","c":"Lecture 3 | Starting a New Document | basis: explanation of quiz Q5"},{"q":"What is an Artboard?","o":["A brush preset","A type of file format","The canvas area that defines the printable/exportable page","A color panel"],"a":2,"e":"The artboard is the working page. By default, anything outside it is not part of the exported or printed area.","w":"A brush preset, a file format and a color panel are unrelated to the page area.","c":"Lecture 3 | Artboards | sample question (quiz Q4)"},{"q":"Where do you set the artboard width, height and units when creating a file?","o":["In the New Document dialog (Preset Details)","In the Layers panel","In the Swatches panel","In the Save dialog"],"a":0,"e":"Width, Height, Units, Orientation and Number of Artboards are set in the New Document dialog before clicking Create.","w":"The Layers panel organizes stacking, Swatches stores colors, and the Save dialog names and formats a file; none of them sets page size.","c":"Lecture 3 | Artboards | sample question (quiz Q5)"},{"q":"Which shortcut selects the Selection Tool (black arrow) to move whole objects?","o":["A","M","L","V"],"a":3,"e":"V is the Selection Tool. A is the Direct Selection Tool (white arrow) for anchor points.","w":"A is the Direct Selection Tool, M is the Rectangle Tool and L is the Ellipse Tool.","c":"Lecture 3 | Selection Tools and Shortcuts | sample question (quiz Q6)"},{"q":"A designer wants to move a single anchor point of a shape without moving the whole object. Which tool and shortcut should be used?","o":["Selection Tool (black arrow), V","Direct Selection Tool (white arrow), A","Shape Builder Tool, Shift + M","Reflect Tool, O"],"a":1,"e":"The Direct Selection Tool (A) selects and edits individual anchor points, while the Selection Tool (V) works on whole objects.","w":"The black arrow moves the entire object; Shape Builder merges or cuts shapes; Reflect mirrors an object.","c":"Lecture 3 | Selection Tools and Shortcuts | basis: explanation of quiz Q6"},{"q":"Which tool draws a rectangle or square?","o":["Ellipse Tool (L)","Polygon Tool","Rectangle Tool (M)","Line Segment Tool"],"a":2,"e":"The Rectangle Tool shortcut is M. The Ellipse Tool is L.","w":"Ellipse draws circles/ovals, Polygon draws multi-sided shapes, and Line Segment draws straight lines.","c":"Lecture 3 | Drawing Basic Shapes | sample question (quiz Q7)"},{"q":"How do you draw a perfect circle with the Ellipse Tool?","o":["Hold Shift while dragging","Hold Alt while dragging","Hold Ctrl while dragging","Double-click the artboard twice"],"a":0,"e":"Holding Shift constrains proportions: a perfect circle (or a perfect square with the Rectangle Tool).","w":"Alt draws from the center but does not lock proportions; Ctrl is not the constraining key; double-clicking is not the method described.","c":"Lecture 3 | Drawing Basic Shapes | sample question (quiz Q8)"},{"q":"What does holding Alt (Option on Mac) do while drawing a shape?","o":["Locks the color","Deletes the shape","Rotates it 90 degrees","Draws it from the center"],"a":3,"e":"Alt/Option draws the shape from its center outward.","w":"Alt/Option has no role in locking color, deleting, or rotating.","c":"Lecture 3 | Drawing Basic Shapes | sample question (quiz Q9)"},{"q":"Which modifier-key combination draws a proportional shape (circle or square) outward from its center?","o":["Shift only","Alt/Option + Shift","Alt/Option only","Ctrl/Cmd + Shift"],"a":1,"e":"Shift keeps proportions and Alt/Option draws from the center. Together they give a proportional shape from the center.","w":"Shift alone is proportional but not centered; Alt/Option alone is centered but not proportional; Ctrl/Cmd + Shift is not the combination described in the lecture.","c":"Lecture 3 | Drawing Basic Shapes | basis: explanation of quiz Q9"},{"q":"How can you create a shape with exact dimensions?","o":["Click once on the artboard with the shape tool and type Width and Height","Draw it and guess the size","Use the Save As dialog","Use the Eyedropper Tool"],"a":0,"e":"Clicking once on the artboard with a shape tool opens a dialog where you enter exact values.","w":"Guessing is imprecise, Save As handles files, and the Eyedropper is not a sizing tool.","c":"Lecture 3 | Drawing Basic Shapes | sample question (quiz Q10)"},{"q":"While drawing with the Polygon Tool (before releasing the mouse), what changes the number of sides?","o":["The Tab key","The Delete key","Up and Down arrow keys","The Caps Lock key"],"a":2,"e":"The Up/Down arrow keys add or remove sides (the Star Tool's points work the same way). A 3-sided polygon is a triangle.","w":"Tab, Delete and Caps Lock play no role in setting the number of sides.","c":"Lecture 3 | Drawing Basic Shapes | sample question (quiz Q11)"},{"q":"How do you make a triangle from basic shapes?","o":["Use the Ellipse Tool with Shift","Use the Rectangle Tool","Use the Eraser Tool","Use the Polygon Tool with 3 sides"],"a":3,"e":"The Polygon Tool with 3 sides gives a triangle.","w":"Ellipse + Shift gives a circle, Rectangle gives four-sided shapes, and the Eraser removes artwork.","c":"Lecture 3 | Drawing Basic Shapes | sample question (quiz Q12)"},{"q":"For which parts of a drawing does the lecture say a 3-sided Polygon is especially useful?","o":["Eyes, heads and bodies","Ears, beaks and noses","Whiskers, legs and outlines","Wheels, suns and bubbles"],"a":1,"e":"A 3-sided Polygon (triangle) is described as very useful for ears, beaks and noses.","w":"Eyes, heads, bodies, wheels, suns and bubbles are round shapes (circle/ellipse); whiskers and legs are straight lines drawn with the Line Segment Tool.","c":"Lecture 3 | Drawing Basic Shapes | basis: explanation of quiz Q12"},{"q":"Which panel or tool lets you merge several shapes into one (Unite) or cut one from another (Minus Front)?","o":["Pathfinder panel","Swatches panel","Character panel","Artboards panel"],"a":0,"e":"The Pathfinder panel has Unite, Minus Front, Intersect and Exclude. The Shape Builder Tool (Shift + M) does similar work interactively.","w":"Swatches stores colors, Character formats text, and Artboards manages pages.","c":"Lecture 3 | Pathfinder, Grouping and Arranging | sample question (quiz Q13)"},{"q":"Which Pathfinder operation merges the selected shapes into a single combined shape?","o":["Minus Front","Intersect","Unite","Exclude"],"a":2,"e":"Unite merges several shapes into one. Minus Front, by contrast, cuts the front shape out of the one behind it.","w":"Minus Front removes rather than merges; Intersect and Exclude are other Pathfinder operations listed in the lecture, but they are not the merging command.","c":"Lecture 3 | Pathfinder, Grouping and Arranging | basis: explanation of quiz Q13"},{"q":"Which shortcut activates the Shape Builder Tool, which merges or cuts overlapping shapes interactively?","o":["M","L","O","Shift + M"],"a":3,"e":"The Shape Builder Tool is Shift + M.","w":"M is the Rectangle Tool, L is the Ellipse Tool, and O is the Reflect Tool.","c":"Lecture 3 | Pathfinder, Grouping and Arranging | basis: explanation of quiz Q13"},{"q":"What does Ctrl/Cmd + G do?","o":["Gets a new color","Groups the selected objects","Goes to the next artboard","Guides the ruler"],"a":1,"e":"Ctrl/Cmd + G groups o
