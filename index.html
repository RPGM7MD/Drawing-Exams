  HOW TO ADD THINGS  (all of this happens in PART 4)

  ① ADD A QUESTION
     Find the lecture (Ctrl+F "GRAPHIC DESIGN · LECTURE 2"), copy one question block and paste
     it just before that lecture's closing  ]),   line. Then change the text.

       Multiple choice:   mc("Question?", ["Option A","Option B","Option C","Option D"], "B", "Why B is right."),
       True / False:      tf("The statement.", true, "Why it is true."),

     • The answer for mc() is a letter in quotes: "A" "B" "C" or "D"
     • The answer for tf() is  true  or  false  (no quotes)
     • tf() adds the words "True." / "False." to the explanation by itself
     • The explanation (4th item of mc) is optional - you can leave it out
     • To mark a DOCTOR'S question, type a bullet •  at the very end of the question text
     • Optional 5th item for mc():  { w: "why the other options are wrong", c: "source / page" }

<script>
var SUBJECTS = [];   // every subject you add in PART 4 lands in this list
var PROBLEMS = [];   // mistakes found in the questions - shown in a red box on the first screen

// If a subject block has a typo, the browser stops that block only. We catch it and tell you the line.
window.addEventListener("error", function (e) {
  PROBLEMS.push("Typo in the file near line " + e.lineno + ": " + e.message +
                "  (look at that line, or the one just before it: usually a missing comma or quote)");
});

// A multiple-choice question.  answer is "A" "B" "C" or "D".
function mc(question, options, answer, why, extra) {
  var q = { q: question, o: options, a: "ABCD".indexOf(answer), e: why };
  if (extra) { if (extra.w) q.w = extra.w; if (extra.c) q.c = extra.c; }
  if (typeof question !== "string" || !question)                      q.bad = "the question text is missing";
  else if (!Array.isArray(options) || options.length < 2 || options.length > 4) q.bad = "mc() needs 2 to 4 options inside [ ]";
  else if (!/^[A-D]$/.test(answer) || "ABCD".indexOf(answer) >= options.length) q.bad = 'the answer must be "A", "B", "C" or "D" and match one of the options';
  return q;
}

// A true/false question.  isTrue is true or false (no quotes).
function tf(statement, isTrue, why) {
  var q = { q: statement, o: ["True", "False"], a: isTrue === true ? 0 : 1,
            e: (isTrue === true ? "True. " : "False. ") + (why || ""), t: 1 };
  if (typeof statement !== "string" || !statement) q.bad = "the statement text is missing";
  else if (typeof isTrue !== "boolean")            q.bad = "the 2nd value must be true or false (without quotes)";
  return q;
}

// A lecture = a title + its list of questions.
function lecture(title, questions) { return { title: title, qs: questions }; }

// Registers a subject (one tab). Checks it and drops any broken question instead of crashing the app.
function addSubject(s) {
  if (!s || !s.id || !s.name || !Array.isArray(s.lectures)) { PROBLEMS.push("A subject is missing id, name or lectures."); return; }
  if (SUBJECTS.some(function (x) { return x.id === s.id; })) { PROBLEMS.push('Two subjects use the same id "' + s.id + '". Each id must be unique.'); return; }
  s.lectures.forEach(function (lec, li) {
    var good = [];
    (lec.qs || []).forEach(function (q, qi) {
      if (q && q.bad) PROBLEMS.push(s.name + " › Lecture " + (li + 1) + " › question " + (qi + 1) + ": " + q.bad);
      else good.push(q);
    });
    lec.qs = good;
  });
  s.mixed = s.lectures.some(function (l) { return l.qs.some(function (q) { return q.t; }); });   // has true/false -> show type labels
  SUBJECTS.push(s);
}
</script>

<!-- ═══════════════════ PART 5 · APP CODE (don't edit) ═══════════════════ -->
<script>
const app = document.getElementById("app");

/* ---- state (what the app remembers while it runs) ---- */
let S = 0;                  // the open subject (position in SUBJECTS)
let D = [], T = [];         // D = questions of each lecture, T = lecture titles (of the open subject)
let L = 0;                  // the open lecture
let order = [], pos = 0;    // order of the questions, and which one we are on
let score = 0, wrong = [];  // score so far, and the questions answered wrongly
let shuffle = false;        // "random order" checkbox

/* ---- small helpers ---- */
function el(tag, cls, text) {                       // quick way to make an element
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function clear() { app.replaceChildren(); window.scrollTo(0, 0); }

// best score is saved on the phone, one per subject per lecture (e.g. "gd-best-3")
function bestKey(n) { return SUBJECTS[S].id + "-best-" + n; }
function getBest(n) { try { return JSON.parse(localStorage.getItem(bestKey(n))); } catch (e) { return null; } }
function setBest(n, s, t) {
  try { const b = getBest(n); if (!b || s > b.s) localStorage.setItem(bestKey(n), JSON.stringify({ s, t })); } catch (e) {}
}

// text of an answer: "B) text" for multiple choice, "True"/"False" for true-false
function ans(q, k) { return q.t ? q.o[k] : "ABCD"[k] + ") " + q.o[k]; }

function useSubject(i) {                            // switch to another subject (tab)
  S = i;
  const s = SUBJECTS[i];
  D = s.lectures.map(l => l.qs);
  T = s.lectures.map(l => l.title);
  try { localStorage.setItem("ds-subject-id", s.id); } catch (e) {}
}

/* ---- SCREEN 1: home (tabs + list of lectures) ---- */
function home() {
  clear();

  if (PROBLEMS.length) {                            // red box, only when something is wrong in the file
    const box = el("div", "err"), ul = el("ul");
    box.append(el("b", null, "Problems found in the questions file:"));
    PROBLEMS.forEach(p => ul.append(el("li", null, p)));
    box.append(ul); app.append(box);
  }
  if (!SUBJECTS.length) { app.append(el("p", "sub", "No subjects loaded. Check the red box above.")); return; }

  const s = SUBJECTS[S];

  // the tabs
  const tabs = el("div", "tabs");
  tabs.setAttribute("role", "tablist");
  SUBJECTS.forEach((x, i) => {
    const b = el("button", "tab" + (S === i ? " on" : ""), x.name);
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", S === i ? "true" : "false");
    b.onclick = () => { if (S !== i) { useSubject(i); home(); } };
    tabs.append(b);
  });
  app.append(tabs);

  // heading + short intro
  app.append(
    el("h1", null, s.title || "بنك أسئلة " + s.name),
    el("p", "sub", s.intro || "اختار محاضرة وابدأ. التصحيح بيظهر فورًا بعد كل إجابة.")
  );

  // "random order" checkbox
  const o = el("div", "opts"), lb = el("label"), cb = document.createElement("input");
  cb.type = "checkbox"; cb.id = "shuf"; cb.checked = shuffle; cb.onchange = () => { shuffle = cb.checked; };
  lb.append(cb, el("span", null, "ترتيب الأسئلة عشوائي"));
  o.append(lb); app.append(o);

  // the lectures
  const list = el("div", "list");
  T.forEach((title, i) => {
    const b = el("button", "lec"), best = getBest(i + 1);
    b.append(el("div", "n", String(i + 1)));
    const tx = el("div", "t");
    tx.append(el("b", null, title), el("span", null, "المحاضرة " + (i + 1) + " · " + D[i].length + " سؤال"));
    const nt = D[i].filter(x => x.t).length;        // how many true/false questions
    if (nt) {
      const x = el("span", "en", (D[i].length - nt) + " MCQ + " + nt + " True / False");
      x.style.display = "block"; x.style.whiteSpace = "nowrap";
      tx.append(x);
    }
    b.append(tx, el("div", "best" + (best ? " has" : ""), best ? best.s + "/" + best.t : "—"));
    b.onclick = () => start(i);
    list.append(b);
  });
  app.append(list);
}

/* ---- start a lecture (or only the wrong questions) ---- */
function start(i, only) {
  if (!D[i].length) return;                         // empty lecture: nothing to show
  L = i; pos = 0; score = 0; wrong = [];
  order = only ? only.slice() : D[i].map((_, k) => k);
  if (shuffle) {                                    // shuffle the order
    for (let k = order.length - 1; k > 0; k--) {
      const j = Math.floor(Math.random() * (k + 1));
      [order[k], order[j]] = [order[j], order[k]];
    }
  }
  quiz();
}

/* ---- SCREEN 2: one question ---- */
function quiz() {
  clear();
  const n = order.length, q = D[L][order[pos]];

  // top row, progress bar, counters
  const top = el("div", "top"), bk = el("button", "back", "← الرئيسية");
  bk.onclick = home;
  top.append(bk, el("span", "en num", "Lecture " + (L + 1)));
  const bar = el("div", "bar"), fill = document.createElement("i");
  fill.style.width = (pos / n * 100) + "%"; bar.append(fill);
  const meta = el("div", "meta"), mn = el("span", null, "سؤال " + (pos + 1) + " من " + n), ms = el("span", null, "الدرجة: " + score);
  meta.append(mn, ms);

  // the question card
  const card = el("div", "card");
  if (SUBJECTS[S].mixed) card.append(el("div", "tag en", q.t ? "True / False" : "Multiple Choice"));
  card.append(el("p", "q en", q.q));
  const fb = el("div", "fb");                       // feedback area (filled after answering)

  q.o.forEach((text, k) => {                        // one button per option
    const b = el("button", "opt"), label = el("b", null, (q.t ? "TF" : "ABCD")[k] + ")");
    b.append(label, el("span", null, text));
    b.onclick = () => {
      const ok = k === q.a;
      card.querySelectorAll(".opt").forEach((x, j) => {        // lock buttons, color right/wrong
        x.disabled = true;
        if (j === q.a) x.classList.add("ok"); else if (j === k) x.classList.add("no");
      });
      if (ok) score++; else wrong.push({ id: order[pos], pick: k });
      ms.textContent = "الدرجة: " + score;

      // explanation box
      const ex = el("div", "ex " + (ok ? "ok" : "no"));
      ex.append(el("strong", null, ok ? "إجابة صحيحة ✓" : "إجابة خاطئة ✗"));
      if (!ok && !q.t) {                                       // (true/false already says it in the explanation)
        const c = el("div", "en num", "Correct: " + "ABCD"[q.a]);
        c.style.marginBottom = "4px"; ex.append(c);
      }
      if (q.e) ex.append(el("p", null, q.e));
      fb.append(ex);

      if (q.w) {                                               // optional: why the other options are wrong
        const d = el("details"), sm = el("summary", null, "ليه باقي الاختيارات غلط؟");
        d.append(sm, el("p", null, q.w)); fb.append(d);
      }
      if (q.c) fb.append(el("div", "cite", "Source: " + q.c));  // optional: source / page

      const nx = el("button", "btn", pos < n - 1 ? "السؤال التالي" : "شوف النتيجة");
      nx.onclick = () => { pos++; pos < n ? quiz() : result(); };
      fb.append(nx);
      nx.focus({ preventScroll: true });
      nx.scrollIntoView({ block: "nearest", behavior: "smooth" });
    };
    card.append(b);
  });

  card.append(fb);
  app.append(top, bar, meta, card);
}

/* ---- SCREEN 3: result ---- */
function result() {
  clear();
  const n = order.length;
  setBest(L + 1, score, n);
  const p = Math.round(score / n * 100), card = el("div", "card");
  app.append(el("h1", null, "خلصت الاختبار"), el("p", "sub en", "Lecture " + (L + 1) + " · \u2068" + T[L] + "\u2069"));
  card.append(el("div", "score", score + " / " + n), el("p", "pct num", p + "%"));

  if (wrong.length) {                               // list of the questions answered wrongly
    card.append(el("b", null, "أسئلة محتاجة مراجعة (" + wrong.length + ")"));
    const ul = el("ul", "rev");
    wrong.forEach(w => {
      const q = D[L][w.id], li = el("li");
      li.append(
        el("b", null, (w.id + 1) + ". " + q.q),
        el("div", "y", "Your answer: " + ans(q, w.pick)),
        el("div", "r", "Correct: " + ans(q, q.a))
      );
      ul.append(li);
    });
    card.append(ul);
  } else card.append(el("p", null, "كل الإجابات صح، ممتاز!"));

  const r = el("div", "row");
  if (wrong.length) {
    const b = el("button", "btn", "راجع الغلط بس");
    b.onclick = () => start(L, wrong.map(w => w.id)); r.append(b);
  }
  const a = el("button", "btn alt", "ابدأ من الأول"); a.onclick = () => start(L);
  const h = el("button", "btn alt", "الرئيسية");     h.onclick = home;
  r.append(a, h); card.append(r); app.append(card);
}

/* ---- START: open the subject you used last time, then show the home screen ---- */
if (SUBJECTS.length) {
  let first = 0;
  try {
    const k = SUBJECTS.findIndex(s => s.id === localStorage.getItem("ds-subject-id"));
    if (k >= 0) first = k;
  } catch (e) {}
  useSubject(first);
}
home();
</script>
